<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">

import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";


/* =====================================================
   VARIABLES
===================================================== */

let scene;
let camera;
let renderer;
let clock;

let player;
let playerMixer;
let animations={};
let currentAnimation=null;

let enemies=[];
let bullets=[];
let enemyBullets=[];

let walls=[];
let houses=[];
let lootItems=[];

let running=false;
let dead=false;

let health=100;

let magazine=30;
let reserveAmmo=120;

let reloading=false;
let shooting=false;

let yaw=0;
let pitch=.18;

let keys={};

let joyX=0;
let joyY=0;

let nearestLoot=null;

let lastShot=0;

const PLAYER_SPEED=.12;


/* =====================================================
   INITIALIZE
===================================================== */

async function init(){

    scene=new THREE.Scene();

    scene.background=new THREE.Color(0x8fc4ed);

    scene.fog=new THREE.Fog(
        0x8fc4ed,
        80,
        240
    );


    camera=new THREE.PerspectiveCamera(
        68,
        innerWidth/innerHeight,
        .1,
        500
    );


    renderer=new THREE.WebGLRenderer({
        antialias:true
    });

    renderer.setSize(
        innerWidth,
        innerHeight
    );

    renderer.setPixelRatio(
        Math.min(devicePixelRatio,2)
    );

    renderer.shadowMap.enabled=true;

    renderer.shadowMap.type=
        THREE.PCFSoftShadowMap;

    renderer.outputColorSpace=
        THREE.SRGBColorSpace;

    document.body.appendChild(
        renderer.domElement
    );


    clock=new THREE.Clock();


    /* LIGHTING */

    const hemi=
        new THREE.HemisphereLight(
            0xddeeff,
            0x344b29,
            2.4
        );

    scene.add(hemi);


    const sun=
        new THREE.DirectionalLight(
            0xfff3dc,
            3.2
        );

    sun.position.set(
        70,
        110,
        50
    );

    sun.castShadow=true;

    sun.shadow.mapSize.width=2048;
    sun.shadow.mapSize.height=2048;

    sun.shadow.camera.left=-120;
    sun.shadow.camera.right=120;
    sun.shadow.camera.top=120;
    sun.shadow.camera.bottom=-120;

    scene.add(sun);


    createGround();
    createRoads();
    createHouses();
    createTrees();
    createLootOutside();

    await loadPlayer();

    await loadEnemies();

    setupControls();

    document.getElementById(
        "loading"
    ).style.display="none";

    animate();
}


/* =====================================================
   GROUND
===================================================== */

function createGround(){

    const ground=
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                240,
                240
            ),
            new THREE.MeshStandardMaterial({
                color:0x538b42,
                roughness:1
            })
        );

    ground.rotation.x=-Math.PI/2;

    ground.receiveShadow=true;

    scene.add(ground);


    /* small grass patches */

    const grassMat=
        new THREE.MeshStandardMaterial({
            color:0x467b38
        });


    for(let i=0;i<180;i++){

        const x=
            (Math.random()-.5)*220;

        const z=
            (Math.random()-.5)*220;


        const patch=
            new THREE.Mesh(
                new THREE.CircleGeometry(
                    .7+Math.random()*1.2,
                    6
                ),
                grassMat
            );


        patch.rotation.x=-Math.PI/2;

        patch.position.set(
            x,
            .012,
            z
        );

        scene.add(patch);
    }
}


/* =====================================================
   ROADS
===================================================== */

function createRoads(){

    const roadMat=
        new THREE.MeshStandardMaterial({
            color:0x424242,
            roughness:.95
        });


    const road1=
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                240,
                14
            ),
            roadMat
        );

    road1.rotation.x=-Math.PI/2;
    road1.position.y=.015;

    scene.add(road1);


    const road2=
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                14,
                240
            ),
            roadMat
        );

    road2.rotation.x=-Math.PI/2;
    road2.position.y=.016;

    scene.add(road2);


    /* road markings */

    const lineMat=
        new THREE.MeshBasicMaterial({
            color:0xd7c65c
        });


    for(let x=-110;x<=110;x+=12){

        const line=
            new THREE.Mesh(
                new THREE.PlaneGeometry(
                    5,
                    .18
                ),
                lineMat
            );

        line.rotation.x=-Math.PI/2;

        line.position.set(
            x,
            .03,
            0
        );

        scene.add(line);
    }


    for(let z=-110;z<=110;z+=12){

        const line=
            new THREE.Mesh(
                new THREE.PlaneGeometry(
                    .18,
                    5
                ),
                lineMat
            );

        line.rotation.x=-Math.PI/2;

        line.position.set(
            0,
            .03,
            z
        );

        scene.add(line);
    }
}


/* =====================================================
   HOUSE
   IMPORTANT:
   HOUSE HAS REAL DOOR OPENING.
   CAMERA WILL NOT GO THROUGH WALLS.
===================================================== */

function createHouse(
    x,
    z,
    width,
    depth
){

    const group=new THREE.Group();

    const wallMat=
        new THREE.MeshStandardMaterial({
            color:0xc5aa87,
            roughness:.82
        });

    const insideMat=
        new THREE.MeshStandardMaterial({
            color:0x806b55,
            roughness:1
        });


    const H=5;
    const T=.6;
    const doorWidth=3.6;

    /* FRONT LEFT */

    const leftWidth=
        (width-doorWidth)/2;


    addWall(
        group,
        leftWidth,
        H,
        T,
        -(width+doorWidth)/4,
        H/2,
        depth/2,
        wallMat
    );


    /* FRONT RIGHT */

    addWall(
        group,
        leftWidth,
        H,
        T,
        (width+doorWidth)/4,
        H/2,
        depth/2,
        wallMat
    );


    /* ABOVE DOOR */

    addWall(
        group,
        doorWidth,
        1.8,
        T,
        0,
        4.1,
        depth/2,
        wallMat
    );


    /* BACK */

    addWall(
        group,
        width,
        H,
        T,
        0,
        H/2,
        -depth/2,
        wallMat
    );


    /* LEFT */

    addWall(
        group,
        T,
        H,
        depth,
        -width/2,
        H/2,
        0,
        wallMat
    );


    /* RIGHT */

    addWall(
        group,
        T,
        H,
        depth,
        width/2,
        H/2,
        0,
        wallMat
    );


    /* FLOOR */

    const floor=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width-.2,
                .15,
                depth-.2
            ),
            insideMat
        );

    floor.position.y=.075;

    floor.receiveShadow=true;

    group.add(floor);


    /* ROOF */

    const roof=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width+1,
                .5,
                depth+1
            ),
            new THREE.MeshStandardMaterial({
                color:0x573a2d,
                roughness:.9
            })
        );

    roof.position.y=5.25;

    roof.castShadow=true;

    group.add(roof);


    /* DOOR FRAME */

    const frameMat=
        new THREE.MeshStandardMaterial({
            color:0x49301f
        });


    addFrame(
        group,
        -.5*doorWidth,
        1.5,
        depth/2+.08,
        frameMat
    );


    addFrame(
        group,
        .5*doorWidth,
        1.5,
        depth/2+.08,
        frameMat
    );


    const topFrame=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                doorWidth+.3,
                .25,
                .25
            ),
            frameMat
        );

    topFrame.position.set(
        0,
        3.05,
        depth/2+.08
    );

    group.add(topFrame);


    /* INTERIOR LIGHT */

    const light=
        new THREE.PointLight(
            0xffd29a,
            1.8,
            13
        );

    light.position.set(
        0,
        3.8,
        0
    );

    group.add(light);


    group.position.set(
        x,
        0,
        z
    );

    scene.add(group);


    houses.push({
        x,
        z,
        width,
        depth,
        group
    });


    /* loot inside */

    createLoot(
        x-3,
        .45,
        z-2,
        "ammo"
    );

    createLoot(
        x+2.5,
        .45,
        z-1,
        "medkit"
    );

    createLoot(
        x,
        .45,
        z+3,
        "weapon"
    );
}


function addWall(
    group,
    w,
    h,
    d,
    x,
    y,
    z,
    material
){

    const mesh=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w,h,d
            ),
            material
        );

    mesh.position.set(
        x,y,z
    );

    mesh.castShadow=true;
    mesh.receiveShadow=true;

    group.add(mesh);

    walls.push(mesh);
}


function addFrame(
    group,
    x,
    y,
    z,
    material
){

    const frame=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .25,
                3,
                .25
            ),
            material
        );

    frame.position.set(
        x,y,z
    );

    group.add(frame);
}


/* =====================================================
   HOUSE LOCATIONS
===================================================== */

function createHouses(){

    const data=[
        [-48,-45,18,14],
        [-20,-48,15,13],
        [35,-47,19,14],
        [55,-18,15,19],
        [-53,20,19,14],
        [-27,45,19,14],
        [35,35,20,15],
        [60,60,16,13],
        [-65,62,16,13]
    ];


    for(
        const h of data
    ){

        createHouse(
            h[0],
            h[1],
            h[2],
            h[3]
        );
    }
}


/* =====================================================
   TREES
===================================================== */

function createTrees(){

    for(let i=0;i<100;i++){

        const x=
            (Math.random()-.5)*210;

        const z=
            (Math.random()-.5)*210;


        if(
            Math.abs(x)<10 ||
            Math.abs(z)<10
        )
            continue;


        const group=
            new THREE.Group();


        const trunk=
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .3,
                    .5,
                    4,
                    8
                ),
                new THREE.MeshStandardMaterial({
                    color:0x684525
                })
            );

        trunk.position.y=2;

        trunk.castShadow=true;


        const crown=
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    2.5,
                    10,
                    8
                ),
                new THREE.MeshStandardMaterial({
                    color:0x276b2c,
                    roughness:.95
                })
            );

        crown.position.y=5;

        crown.castShadow=true;


        group.add(
            trunk,
            crown
        );


        group.position.set(
            x,
            0,
            z
        );


        scene.add(group);
    }
}


/* =====================================================
   LOOT
===================================================== */

function createLoot(
    x,
    y,
    z,
    type
){

    let color;
    let name;


    if(type==="ammo"){

        color=0xffc400;
        name="AMMO";

    }
    else if(type==="medkit"){

        color=0x24e66b;
        name="MEDKIT";

    }
    else{

        color=0x39a9ff;
        name="WEAPON";

    }


    const group=
        new THREE.Group();


    const box=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .7,
                .5,
                .7
            ),
            new THREE.MeshStandardMaterial({
                color,
                emissive:color,
                emissiveIntensity:.12
            })
        );


    box.position.y=.3;

    box.castShadow=true;


    const glow=
        new THREE.PointLight(
            color,
            1.2,
            4
        );

    glow.position.y=1;


    group.add(
        box,
        glow
    );


    group.position.set(
        x,y,z
    );


    scene.add(group);


    lootItems.push({
        group,
        type,
        name,
        taken:false
    });
}


/* =====================================================
   OUTSIDE LOOT
===================================================== */

function createLootOutside(){

    createLoot(
        7,.45,7,
        "ammo"
    );

    createLoot(
        -8,.45,10,
        "medkit"
    );

    createLoot(
        15,.45,-10,
        "weapon"
    );
}


/* =====================================================
   LOAD PLAYER
===================================================== */

async function loadPlayer(){

    const loader=
        new GLTFLoader();


    const gltf=
        await loader.loadAsync(
            "https://threejs.org/examples/models/gltf/Soldier.glb"
        );


    player=gltf.scene;

    player.scale.setScalar(1.8);

    player.position.set(
        0,0,0
    );


    player.traverse(
        obj=>{

            if(obj.isMesh){

                obj.castShadow=true;
                obj.receiveShadow=true;

            }

        }
    );


    scene.add(player);


    playerMixer=
        new THREE.AnimationMixer(
            player
        );


    gltf.animations.forEach(
        clip=>{

            animations[
                clip.name
            ]=
                playerMixer.clipAction(
                    clip
                );

        }
    );


    if(animations.Idle){

        animations.Idle.play();

        currentAnimation=
            animations.Idle;

    }
}


/* =====================================================
   LOAD ENEMIES
===================================================== */

async function loadEnemies(){

    const loader=
        new GLTFLoader();


    const gltf=
        await loader.loadAsync(
            "https://threejs.org/examples/models/gltf/Soldier.glb"
        );


    for(let i=0;i<8;i++){

        const enemy=
            gltf.scene.clone(true);


        enemy.scale.setScalar(1.8);


        let x,z;


        do{

            x=
                (Math.random()-.5)*150;

            z=
                (Math.random()-.5)*150;

        }
        while(
            Math.sqrt(x*x+z*z)<30
        );


        enemy.position.set(
            x,0,z
        );


        enemy.traverse(
            obj=>{

                if(obj.isMesh)
                    obj.castShadow=true;

            }
        );


        scene.add(enemy);


        const mixer=
            new THREE.AnimationMixer(
                enemy
            );


        const walk=
            gltf.animations.find(
                a=>a.name==="Walk"
            );


        if(walk){

            mixer.clipAction(
                walk
            ).play();

        }


        enemies.push({
            mesh:enemy,
            mixer,
            hp:100,
            cooldown:0
        });
    }


    updateEnemyHUD();
}


/* =====================================================
   WALL COLLISION
   Door opening automatically has no wall.
===================================================== */

function isBlocked(
    x,
    z
){

    const r=.65;


    for(
        const wall of walls
    ){

        const box=
            new THREE.Box3()
            .setFromObject(
                wall
            );


        if(
            x>box.min.x-r &&
            x<box.max.x+r &&
            z>box.min.z-r &&
            z<box.max.z+r
        ){

            return true;

        }
    }


    return false;
}


/* =====================================================
   PLAYER
===================================================== */

function updatePlayer(){

    if(!player)
        return;


    let f=0;
    let r=0;


    if(keys.w)f++;
    if(keys.s)f--;

    if(keys.d)r++;
    if(keys.a)r--;


    f+=-joyY;
    r+=joyX;


    const len=
        Math.sqrt(
            f*f+r*r
        );


    if(len<.01){

        switchAnimation(
            animations.Idle
        );

        return;
    }


    f/=len;
    r/=len;


    const dx=
        Math.sin(yaw)*f+
        Math.cos(yaw)*r;


    const dz=
        Math.cos(yaw)*f-
        Math.sin(yaw)*r;


    const nx=
        player.position.x+
        dx*PLAYER_SPEED;


    const nz=
        player.position.z+
        dz*PLAYER_SPEED;


    if(
        !isBlocked(nx,nz)
    ){

        player.position.x=nx;
        player.position.z=nz;

    }


    player.rotation.y=yaw;


    switchAnimation(
        animations.Run ||
        animations.Walk
    );
}


/* =====================================================
   ANIMATION
===================================================== */

function switchAnimation(
    action
){

    if(
        !action ||
        action===currentAnimation
    )
        return;


    if(currentAnimation)
        currentAnimation.fadeOut(.12);


    action
        .reset()
        .fadeIn(.12)
        .play();


    currentAnimation=action;
}


/* =====================================================
   CAMERA
===================================================== */

function updateCamera(){

    if(!player)
        return;


    const target=
        new THREE.Vector3(
            player.position.x,
            2.2,
            player.position.z
        );


    const wantedDistance=7;

    let camX=
        player.position.x+
        Math.sin(yaw)*
        wantedDistance;

    let camZ=
        player.position.z+
        Math.cos(yaw)*
        wantedDistance;

    let camY=
        3.4+
        pitch*2;


    /*
       CAMERA COLLISION

       Prevent camera from going
       through house walls.
    */

    const from=
        new THREE.Vector3(
            player.position.x,
            2.4,
            player.position.z
        );


    const wanted=
        new THREE.Vector3(
            camX,
            camY,
            camZ
        );


    const direction=
        new THREE.Vector3()
        .subVectors(
            wanted,
            from
        );


    const distance=
        direction.length();


    direction.normalize();


    const ray=
        new THREE.Raycaster(
            from,
            direction,
            .2,
            distance
        );


    const hits=
        ray.intersectObjects(
            walls,
            false
        );


    if(hits.length){

        const hitDistance=
            hits[0].distance-.25;


        const safeDistance=
            Math.max(
                .5,
                hitDistance
            );


        const safe=
            from.clone().add(
                direction.multiplyScalar(
                    safeDistance
                )
            );


        camX=safe.x;
        camY=safe.y;
        camZ=safe.z;
    }


    camera.position.x=
        THREE.MathUtils.lerp(
            camera.position.x,
            camX,
            .16
        );


    camera.position.y=
        THREE.MathUtils.lerp(
            camera.position.y,
            camY,
            .16
        );


    camera.position.z=
        THREE.MathUtils.lerp(
            camera.position.z,
            camZ,
            .16
        );


    camera.lookAt(
        target
    );
}


/* =====================================================
   SHOOT
===================================================== */

function shoot(){

    if(
        !running ||
        dead ||
        reloading
    )
        return;


    const now=
        performance.now();


    if(
        now-lastShot<170
    )
        return;


    if(
        magazine<=0
    ){

        reload();

        return;
    }


    lastShot=now;

    magazine--;

    updateAmmo();


    const bullet=
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .1,
                8,
                8
            ),
            new THREE.MeshBasicMaterial({
                color:0xffff66
            })
        );


    bullet.position.set(
        player.position.x,
        2.3,
        player.position.z
    );


    const dir=
        new THREE.Vector3();


    camera.getWorldDirection(
        dir
    );


    bullet.userData.velocity=
        dir.multiplyScalar(.85);

    bullet.userData.life=120;


    scene.add(bullet);

    bullets.push(bullet);
}


/* =====================================================
   BULLETS
===================================================== */

function updateBullets(){

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const b=bullets[i];


        b.position.add(
            b.userData.velocity
        );


        b.userData.life--;


        let remove=false;


        /* wall collision */

        const wallHits=
            new THREE.Raycaster(
                b.position.clone(),
                b.userData.velocity.clone().normalize(),
                0,
                .9
            )
            .intersectObjects(
                walls,
                false
            );


        if(wallHits.length){

            remove=true;

        }


        /* enemy collision */

        if(!remove){

            for(
                let j=enemies.length-1;
                j>=0;
                j--
            ){

                const e=enemies[j];


                const d=
                    b.position.distanceTo(
                        e.mesh.position
                    );


                if(d<2.1){

                    e.hp-=50;

                    remove=true;


                    if(
                        e.hp<=0
                    ){

                        scene.remove(
                            e.mesh
                        );

                        enemies.splice(
                            j,
                            1
                        );

                        updateEnemyHUD();
                    }


                    break;
                }
            }
        }


        if(
            remove ||
            b.userData.life<=0
        ){

            scene.remove(b);

            bullets.splice(
                i,
                1
            );
        }
    }
}


/* =====================================================
   ENEMY AI
===================================================== */

function updateEnemies(){

    if(!player)
        return;


    const now=
        performance.now();


    for(
        const e of enemies
    ){

        const dx=
            player.position.x-
            e.mesh.position.x;


        const dz=
            player.position.z-
            e.mesh.position.z;


        const dist=
            Math.hypot(
                dx,dz
            );


        if(
            dist>6
        ){

            const speed=.018;


            const nx=
                e.mesh.position.x+
                dx/dist*speed;


            const nz=
                e.mesh.position.z+
                dz/dist*speed;


            if(
                !isBlocked(nx,nz)
            ){

                e.mesh.position.x=nx;
                e.mesh.position.z=nz;

            }
        }


        e.mesh.lookAt(
            player.position.x,
            2,
            player.position.z
        );


        if(
            dist<45 &&
            now-e.cooldown>1600
        ){

            enemyShoot(e);

            e.cooldown=now;
        }


        e.mixer.update(
            clock.getDelta()
        );
    }
}


/* =====================================================
   ENEMY SHOOT
===================================================== */

function enemyShoot(e){

    const bullet=
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .11,
                8,
                8
            ),
            new THREE.MeshBasicMaterial({
                color:0xff4444
            })
        );


    bullet.position.set(
        e.mesh.position.x,
        2.2,
        e.mesh.position.z
    );


    const dir=
        new THREE.Vector3(
            player.position.x-
            bullet.position.x,
            2-
            bullet.position.y,
            player.position.z-
            bullet.position.z
        ).normalize();


    bullet.userData.velocity=
        dir.multiplyScalar(.4);

    bullet.userData.life=150;


    scene.add(bullet);

    enemyBullets.push(bullet);
}


/* =====================================================
   ENEMY BULLETS
===================================================== */

function updateEnemyBullets(){

    for(
        let i=enemyBullets.length-1;
        i>=0;
        i--
    ){

        const b=
            enemyBullets[i];


        b.position.add(
            b.userData.velocity
        );


        b.userData.life--;


        const hitWall=
            new THREE.Raycaster(
                b.position.clone(),
                b.userData.velocity.clone().normalize(),
                0,
                .7
            )
            .intersectObjects(
                walls,
                false
            );


        if(hitWall.length){

            scene.remove(b);

            enemyBullets.splice(
                i,
                1
            );

            continue;
        }


        const d=
            b.position.distanceTo(
                player.position
            );


        if(d<1.6){

            health-=10;

            updateHealth();


            scene.remove(b);

            enemyBullets.splice(
                i,
                1
            );


            if(health<=0)
                endGame();


            continue;
        }


        if(
            b.userData.life<=0
        ){

            scene.remove(b);

            enemyBullets.splice(
                i,
                1
            );
        }
    }
}


/* =====================================================
   LOOT
===================================================== */

function updateLoot(){

    if(!player)
        return;


    nearestLoot=null;

    let nearestDistance=3;


    for(
        const item of lootItems
    ){

        if(item.taken)
            continue;


        const d=
            item.group.position.distanceTo(
                player.position
            );


        item.group.rotation.y+=.02;


        if(
            d<nearestDistance
        ){

            nearestLoot=item;
            nearestDistance=d;
        }
    }


    const box=
        document.getElementById(
            "interaction"
        );


    if(nearestLoot){

        box.style.display="block";

        box.textContent=
            "E — PICK UP "+
            nearestLoot.name;

    }
    else{

        box.style.display="none";
    }
}


/* =====================================================
   PICKUP
===================================================== */

function pickupLoot(){

    if(!nearestLoot)
        return;


    const item=
        nearestLoot;


    if(
        item.type==="ammo"
    ){

        reserveAmmo+=60;

        showMessage(
            "📦 +60 AMMO"
        );

    }


    if(
        item.type==="medkit"
    ){

        health=
            Math.min(
                100,
                health+40
            );

        updateHealth();

        showMessage(
            "❤️ +40 HEALTH"
        );
    }


    if(
        item.type==="weapon"
    ){

        magazine=30;

        reserveAmmo+=90;

        updateAmmo();

        showMessage(
            "🔫 WEAPON + AMMO"
        );
    }


    item.taken=true;

    scene.remove(
        item.group
    );


    nearestLoot=null;

    document.getElementById(
        "interaction"
    ).style.display="none";
}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text){

    const m=
        document.getElementById(
            "message"
        );


    m.textContent=text;

    m.style.display="block";


    setTimeout(
        ()=>{
            m.style.display="none";
        },
        1200
    );
}


/* =====================================================
   RELOAD
===================================================== */

function reload(){

    if(
        reloading ||
        magazine>=30 ||
        reserveAmmo<=0
    )
        return;


    reloading=true;

    shooting=false;


    showMessage(
        "RELOADING..."
    );


    setTimeout(
        ()=>{

            const needed=
                30-magazine;


            const amount=
                Math.min(
                    needed,
                    reserveAmmo
                );


            magazine+=amount;

            reserveAmmo-=amount;

            updateAmmo();

            reloading=false;

        },
        900
    );
}


/* =====================================================
   HUD
===================================================== */

function updateHealth(){

    document.getElementById(
        "health"
    ).style.width=
        Math.max(
            0,
            health
        )+"%";
}


function updateAmmo(){

    document.getElementById(
        "ammo"
    ).textContent=
        "🔫 "+
        magazine+
        " / "+
        reserveAmmo;
}


function updateEnemyHUD(){

    document.getElementById(
        "enemyCount"
    ).textContent=
        "👾 ENEMIES: "+
        enemies.length;
}


/* =====================================================
   CONTROLS
===================================================== */

function setupControls(){

    window.addEventListener(
        "keydown",
        e=>{

            keys[
                e.key.toLowerCase()
            ]=true;


            if(
                e.key.toLowerCase()==="r"
            )
                reload();


            if(
                e.key.toLowerCase()==="e"
            )
                pickupLoot();
        }
    );


    window.addEventListener(
        "keyup",
        e=>{

            keys[
                e.key.toLowerCase()
            ]=false;
        }
    );


    renderer.domElement.addEventListener(
        "mousemove",
        e=>{

            if(
                document.pointerLockElement===
                renderer.domElement
            ){

                yaw-=
                    e.movementX*.0025;


                pitch-=
                    e.movementY*.0018;


                pitch=
                    THREE.MathUtils.clamp(
                        pitch,
                        -.35,
                        .55
                    );
            }
        }
    );


    renderer.domElement.addEventListener(
        "mousedown",
        e=>{

            if(
                e.button===0
            ){

                shooting=true;

                shoot();
            }
        }
    );


    window.addEventListener(
        "mouseup",
        e=>{

            if(
                e.button===0
            )
                shooting=false;
        }
    );


    document.getElementById(
        "startBtn"
    ).onclick=()=>{

        running=true;

        document.getElementById(
            "start"
        ).style.display="none";


        if(
            innerWidth>800
        ){

            renderer.domElement
                .requestPointerLock();
        }
    };


    setupMobile();
}


/* =====================================================
   MOBILE
===================================================== */

function setupMobile(){

    const joystick=
        document.getElementById(
            "joystick"
        );

    const stick=
        document.getElementById(
            "stick"
        );


    let active=false;


    joystick.addEventListener(
        "touchstart",
        e=>{

            active=true;

            e.preventDefault();

        },
        {passive:false}
    );


    joystick.addEventListener(
        "touchmove",
        e=>{

            if(!active)
                return;


            const rect=
                joystick.getBoundingClientRect();


            const t=
                e.touches[0];


            let dx=
                t.clientX-
                (
                    rect.left+
                    rect.width/2
                );


            let dy=
                t.clientY-
                (
                    rect.top+
                    rect.height/2
                );


            const max=45;

            const len=
                Math.hypot(dx,dy);


            if(len>max){

                dx=dx/len*max;
                dy=dy/len*max;
            }


            joyX=dx/max;
            joyY=dy/max;


            stick.style.left=
                39+dx+"px";

            stick.style.top=
                39+dy+"px";


            e.preventDefault();

        },
        {passive:false}
    );


    joystick.addEventListener(
        "touchend",
        ()=>{

            active=false;

            joyX=0;
            joyY=0;

            stick.style.left="39px";
            stick.style.top="39px";
        }
    );


    const fire=
        document.getElementById(
            "fire"
        );


    fire.addEventListener(
        "touchstart",
        e=>{

            shooting=true;

            shoot();

            e.preventDefault();

        },
        {passive:false}
    );


    fire.addEventListener(
        "touchend",
        ()=>{

            shooting=false;
        }
    );


    document.getElementById(
        "reload"
    ).addEventListener(
        "touchstart",
        e=>{

            reload();

            e.preventDefault();

        },
        {passive:false}
    );


    document.getElementById(
        "loot"
    ).addEventListener(
        "touchstart",
        e=>{

            pickupLoot();

            e.preventDefault();

        },
        {passive:false}
    );
}


/* =====================================================
   GAME OVER
===================================================== */

function endGame(){

    if(dead)
        return;


    dead=true;

    running=false;

    shooting=false;


    document.getElementById(
        "gameover"
    ).style.display="flex";
}


/* =====================================================
   MAIN LOOP
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    const dt=
        clock.getDelta();


    if(
        running &&
        !dead
    ){

        if(playerMixer)
            playerMixer.update(dt);


        updatePlayer();

        updateCamera();

        updateBullets();

        updateEnemies();

        updateEnemyBullets();

        updateLoot();


        if(shooting)
            shoot();
    }


    renderer.render(
        scene,
        camera
    );
}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);


/* =====================================================
   START
===================================================== */

init();

</script>
