</style>
</head>

<script type="importmap">
{
    "imports":{
        "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">

import * as THREE from "three";

import {
    GLTFLoader
} from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";


/* =====================================================
   BASIC VARIABLES
===================================================== */

let scene;
let camera;
let renderer;
let clock;

let player;
let playerMixer;

let idleAnimation;
let walkAnimation;
let runAnimation;
let currentAnimation;

let enemies=[];
let bullets=[];
let enemyBullets=[];

let buildings=[];
let walls=[];
let loot=[];

let running=false;
let gameFinished=false;

let health=100;

let magazine=30;
let ammo=120;

let shooting=false;
let lastShot=0;

let yaw=0;
let pitch=.25;

let keys={};

let joystickX=0;
let joystickY=0;

let nearbyLoot=null;

const PLAYER_SPEED=.11;


/* =====================================================
   INIT
===================================================== */

async function init(){

    scene=new THREE.Scene();

    scene.background=
        new THREE.Color(0x8bbce5);

    scene.fog=
        new THREE.Fog(
            0x8bbce5,
            70,
            230
        );


    camera=
        new THREE.PerspectiveCamera(
            70,
            innerWidth/innerHeight,
            .1,
            500
        );


    renderer=
        new THREE.WebGLRenderer({
            antialias:true
        });

    renderer.setSize(
        innerWidth,
        innerHeight
    );

    renderer.setPixelRatio(
        Math.min(
            devicePixelRatio,
            2
        )
    );

    renderer.shadowMap.enabled=true;

    renderer.outputColorSpace=
        THREE.SRGBColorSpace;

    document.body.appendChild(
        renderer.domElement
    );


    clock=new THREE.Clock();


    /* LIGHTING */

    const hemi=
        new THREE.HemisphereLight(
            0xffffff,
            0x38572c,
            2.2
        );

    scene.add(hemi);


    const sun=
        new THREE.DirectionalLight(
            0xffffff,
            3
        );

    sun.position.set(
        60,
        100,
        40
    );

    sun.castShadow=true;

    sun.shadow.mapSize.width=2048;
    sun.shadow.mapSize.height=2048;

    scene.add(sun);


    createGround();

    createRoads();

    createHouses();

    createTrees();

    createOutdoorLoot();

    createPlayer();

    await createEnemies();

    setupControls();


    document.getElementById(
        "loading"
    ).style.display="none";


    animate();
}


/* =====================================================
   GROUND
===================================================== */

function createGround(){

    const ground=
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                220,
                220
            ),

            new THREE.MeshStandardMaterial({
                color:0x508a40,
                roughness:.9
            })

        );


    ground.rotation.x=
        -Math.PI/2;

    ground.receiveShadow=true;

    scene.add(ground);
}


/* =====================================================
   ROADS
===================================================== */

function createRoads(){

    const roadMaterial=
        new THREE.MeshStandardMaterial({
            color:0x444444,
            roughness:.9
        });


    const road1=
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                220,
                14
            ),
            roadMaterial
        );

    road1.rotation.x=
        -Math.PI/2;

    road1.position.y=.02;

    scene.add(road1);


    const road2=
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                14,
                220
            ),
            roadMaterial
        );

    road2.rotation.x=
        -Math.PI/2;

    road2.position.y=.03;

    scene.add(road2);
}


/* =====================================================
   HOUSE SYSTEM
   OPEN FRONT DOOR
===================================================== */

function createHouse(
    x,
    z,
    width,
    depth
){

    const group=
        new THREE.Group();

    const wallMaterial=
        new THREE.MeshStandardMaterial({
            color:0xc7ad8b,
            roughness:.8
        });


    const wallHeight=5;

    const thickness=.7;

    /*
       FRONT WALL
       Door opening is in the middle.
    */

    const sideWidth=
        (width-4)/2;


    /* FRONT LEFT */

    const frontLeft=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                sideWidth,
                wallHeight,
                thickness
            ),

            wallMaterial
        );


    frontLeft.position.set(
        -(width-sideWidth)/2,
        wallHeight/2,
        depth/2
    );


    frontLeft.castShadow=true;

    group.add(frontLeft);


    /* FRONT RIGHT */

    const frontRight=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                sideWidth,
                wallHeight,
                thickness
            ),

            wallMaterial
        );


    frontRight.position.set(
        (width-sideWidth)/2,
        wallHeight/2,
        depth/2
    );


    frontRight.castShadow=true;

    group.add(frontRight);


    /*
       TOP ABOVE DOOR
    */

    const doorTop=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                4,
                1.8,
                thickness
            ),

            wallMaterial
        );


    doorTop.position.set(
        0,
        4.1,
        depth/2
    );


    group.add(doorTop);


    /* BACK WALL */

    const backWall=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                wallHeight,
                thickness
            ),

            wallMaterial
        );


    backWall.position.set(
        0,
        wallHeight/2,
        -depth/2
    );


    backWall.castShadow=true;

    group.add(backWall);


    /* LEFT WALL */

    const leftWall=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                thickness,
                wallHeight,
                depth
            ),

            wallMaterial
        );


    leftWall.position.set(
        -width/2,
        wallHeight/2,
        0
    );


    leftWall.castShadow=true;

    group.add(leftWall);


    /* RIGHT WALL */

    const rightWall=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                thickness,
                wallHeight,
                depth
            ),

            wallMaterial
        );


    rightWall.position.set(
        width/2,
        wallHeight/2,
        0
    );


    rightWall.castShadow=true;

    group.add(rightWall);


    /*
       FLOOR
    */

    const floor=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                .2,
                depth
            ),

            new THREE.MeshStandardMaterial({
                color:0x92745b
            })

        );


    floor.position.y=.05;

    group.add(floor);


    /*
       CEILING
    */

    const ceiling=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                .3,
                depth
            ),

            new THREE.MeshStandardMaterial({
                color:0x756653
            })

        );


    ceiling.position.y=5.1;

    group.add(ceiling);


    /*
       ROOF
    */

    const roof=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width+1.5,
                .7,
                depth+1.5
            ),

            new THREE.MeshStandardMaterial({
                color:0x56362a
            })

        );


    roof.position.y=5.45;

    roof.castShadow=true;

    group.add(roof);


    /*
       DOOR FRAME
    */

    const frameMaterial=
        new THREE.MeshStandardMaterial({
            color:0x553522
        });


    const doorLeft=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .25,
                3,
                .4
            ),

            frameMaterial
        );

    doorLeft.position.set(
        -2,
        1.5,
        depth/2+.2
    );

    group.add(doorLeft);


    const doorRight=
        doorLeft.clone();

    doorRight.position.x=2;

    group.add(doorRight);


    const doorLight=
        new THREE.PointLight(
            0xffd7a0,
            1.5,
            9
        );

    doorLight.position.set(
        0,
        3,
        depth/2+1
    );

    group.add(doorLight);


    group.position.set(
        x,
        0,
        z
    );


    scene.add(group);


    /*
       Store only the real walls
       for collision.
    */

    group.traverse(obj=>{

        if(
            obj.isMesh &&
            obj!==floor &&
            obj!==ceiling &&
            obj!==roof &&
            obj!==doorLeft &&
            obj!==doorRight
        ){

            walls.push(obj);

        }

    });


    buildings.push({
        group,
        x,
        z,
        width,
        depth
    });


    /*
       LOOT INSIDE HOUSE
    */

    createLoot(
        x-3,
        .35,
        z-2,
        "ammo"
    );

    createLoot(
        x+2,
        .35,
        z-1,
        "medkit"
    );

    createLoot(
        x,
        .35,
        z+3,
        "weapon"
    );
}


/* =====================================================
   HOUSE LOCATIONS
===================================================== */

function createHouses(){

    const houses=[
        [-48,-45,18,14],
        [-20,-48,15,13],
        [35,-47,19,14],
        [55,-18,15,19],
        [-53,20,19,14],
        [-27,45,19,14],
        [35,35,20,15],
        [60,60,16,13],
        [-65,62,16,13]
    ];


    for(
        const h of houses
    ){

        createHouse(
            h[0],
            h[1],
            h[2],
            h[3]
        );

    }
}


/* =====================================================
   TREES
===================================================== */

function createTrees(){

    for(
        let i=0;
        i<90;
        i++
    ){

        const x=
            (Math.random()-.5)*200;

        const z=
            (Math.random()-.5)*200;


        if(
            Math.abs(x)<12 ||
            Math.abs(z)<12
        ){

            continue;

        }


        const tree=
            new THREE.Group();


        const trunk=
            new THREE.Mesh(

                new THREE.CylinderGeometry(
                    .35,
                    .55,
                    4,
                    8
                ),

                new THREE.MeshStandardMaterial({
                    color:0x684323
                })

            );


        trunk.position.y=2;

        trunk.castShadow=true;


        const leaves=
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    2.7,
                    10,
                    10
                ),

                new THREE.MeshStandardMaterial({
                    color:0x226c2b
                })

            );


        leaves.position.y=5;

        leaves.castShadow=true;


        tree.add(
            trunk,
            leaves
        );


        tree.position.set(
            x,
            0,
            z
        );


        scene.add(tree);
    }
}


/* =====================================================
   LOOT
===================================================== */

function createLoot(
    x,
    y,
    z,
    type
){

    let color;
    let label;


    if(type==="ammo"){

        color=0xffd400;
        label="AMMO";

    }

    else if(type==="medkit"){

        color=0x22dd66;
        label="MEDKIT";

    }

    else{

        color=0x3ca7ff;
        label="WEAPON";

    }


    const box=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .65,
                .65,
                .65
            ),

            new THREE.MeshStandardMaterial({
                color,
                emissive:color,
                emissiveIntensity:.12
            })

        );


    box.position.set(
        x,
        y,
        z
    );


    box.castShadow=true;


    scene.add(box);


    loot.push({
        mesh:box,
        type,
        label
    });
}


/* =====================================================
   OUTDOOR LOOT
===================================================== */

function createOutdoorLoot(){

    createLoot(
        8,
        .35,
        8,
        "ammo"
    );

    createLoot(
        -8,
        .35,
        10,
        "medkit"
    );

    createLoot(
        15,
        .35,
        -12,
        "weapon"
    );
}


/* =====================================================
   PLAYER
===================================================== */

async function createPlayer(){

    const loader=
        new GLTFLoader();


    const gltf=
        await loader.loadAsync(
            "https://threejs.org/examples/models/gltf/Soldier.glb"
        );


    player=
        gltf.scene;


    player.scale.setScalar(
        1.8
    );


    player.position.set(
        0,
        0,
        0
    );


    player.traverse(obj=>{

        if(obj.isMesh){

            obj.castShadow=true;
            obj.receiveShadow=true;

        }

    });


    scene.add(player);


    playerMixer=
        new THREE.AnimationMixer(
            player
        );


    for(
        const clip of
        gltf.animations
    ){

        if(
            clip.name==="Idle"
        ){

            idleAnimation=
                playerMixer.clipAction(
                    clip
                );

        }

        if(
            clip.name==="Walk"
        ){

            walkAnimation=
                playerMixer.clipAction(
                    clip
                );

        }

        if(
            clip.name==="Run"
        ){

            runAnimation=
                playerMixer.clipAction(
                    clip
                );

        }

    }


    if(idleAnimation){

        idleAnimation.play();

        currentAnimation=
            idleAnimation;

    }
}


/* =====================================================
   ANIMATION
===================================================== */

function setAnimation(
    action
){

    if(
        !action ||
        action===currentAnimation
    ){

        return;

    }


    if(currentAnimation){

        currentAnimation.fadeOut(
            .15
        );

    }


    action
        .reset()
        .fadeIn(.15)
        .play();


    currentAnimation=action;
}


/* =====================================================
   ENEMIES
===================================================== */

async function createEnemies(){

    const loader=
        new GLTFLoader();


    const gltf=
        await loader.loadAsync(
            "https://threejs.org/examples/models/gltf/Soldier.glb"
        );


    for(
        let i=0;
        i<8;
        i++
    ){

        const enemy=
            gltf.scene.clone(
                true
            );


        enemy.scale.setScalar(
            1.8
        );


        let x;
        let z;


        do{

            x=
                (Math.random()-.5)
                *150;

            z=
                (Math.random()-.5)
                *150;

        }
        while(
            Math.sqrt(x*x+z*z)<30
        );


        enemy.position.set(
            x,
            0,
            z
        );


        enemy.traverse(obj=>{

            if(obj.isMesh)
                obj.castShadow=true;

        });


        scene.add(enemy);


        const mixer=
            new THREE.AnimationMixer(
                enemy
            );


        const walk=
            gltf.animations.find(
                a=>a.name==="Walk"
            );


        if(walk){

            mixer
                .clipAction(walk)
                .play();

        }


        enemies.push({
            mesh:enemy,
            mixer,
            hp:100,
            cooldown:Math.random()*2000
        });

    }


    updateEnemyHUD();
}


/* =====================================================
   COLLISION
===================================================== */

function wallCollision(
    x,
    z
){

    const radius=.75;


    for(
        const wall of walls
    ){

        const box=
            new THREE.Box3()
            .setFromObject(
                wall
            );


        if(
            x>box.min.x-radius &&
            x<box.max.x+radius &&
            z>box.min.z-radius &&
            z<box.max.z+radius
        ){

            return true;

        }

    }


    return false;
}


/* =====================================================
   MOVEMENT
===================================================== */

function updatePlayer(){

    if(!player)
        return;


    let forward=0;
    let right=0;


    if(keys["w"])
        forward++;

    if(keys["s"])
        forward--;

    if(keys["d"])
        right++;

    if(keys["a"])
        right--;


    forward+=-joystickY;

    right+=joystickX;


    const len=
        Math.sqrt(
            forward*forward+
            right*right
        );


    if(len<=0){

        setAnimation(
            idleAnimation
        );

        return;

    }


    forward/=len;
    right/=len;


    const dx=
        Math.sin(yaw)*forward+
        Math.cos(yaw)*right;


    const dz=
        Math.cos(yaw)*forward-
        Math.sin(yaw)*right;


    const nx=
        player.position.x+
        dx*PLAYER_SPEED;


    const nz=
        player.position.z+
        dz*PLAYER_SPEED;


    /*
       IMPORTANT:
       Door opening has no wall.
       So player can enter house.
    */

    if(
        !wallCollision(nx,nz)
    ){

        player.position.x=nx;
        player.position.z=nz;

    }


    player.rotation.y=
        yaw;


    setAnimation(
        runAnimation ||
        walkAnimation
    );
}


/* =====================================================
   CAMERA
===================================================== */

function updateCamera(){

    if(!player)
        return;


    const distance=7;

    const cameraX=
        player.position.x+
        Math.sin(yaw)*distance;

    const cameraZ=
        player.position.z+
        Math.cos(yaw)*distance;


    camera.position.set(
        cameraX,
        player.position.y+
        3.5+
        pitch*2,
        cameraZ
    );


    const target=
        new THREE.Vector3(
            player.position.x,
            player.position.y+2.2,
            player.position.z
        );


    camera.lookAt(
        target
    );
}


/* =====================================================
   SHOOT
===================================================== */

function shoot(){

    if(
        !running ||
        gameFinished ||
        !player
    ){

        return;

    }


    const now=
        performance.now();


    if(
        now-lastShot<170
    ){

        return;

    }


    if(magazine<=0){

        reload();

        return;

    }


    lastShot=now;

    magazine--;

    updateAmmo();


    const bullet=
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .11,
                8,
                8
            ),

            new THREE.MeshBasicMaterial({
                color:0xffff00
            })

        );


    bullet.position.set(
        player.position.x,
        2.3,
        player.position.z
    );


    const direction=
        new THREE.Vector3();


    camera.getWorldDirection(
        direction
    );


    bullet.userData.velocity=
        direction.multiplyScalar(
            .85
        );


    bullet.userData.life=110;


    scene.add(bullet);

    bullets.push(bullet);
}


/* =====================================================
   BULLET UPDATE
===================================================== */

function updateBullets(){

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const bullet=
            bullets[i];


        bullet.position.add(
            bullet.userData.velocity
        );


        bullet.userData.life--;


        let hit=false;


        for(
            let j=enemies.length-1;
            j>=0;
            j--
        ){

            const enemy=
                enemies[j];


            const distance=
                bullet.position.distanceTo(
                    enemy.mesh.position
                );


            if(
                distance<2.2
            ){

                enemy.hp-=50;

                scene.remove(
                    bullet
                );

                bullets.splice(
                    i,
                    1
                );


                hit=true;


                if(
                    enemy.hp<=0
                ){

                    scene.remove(
                        enemy.mesh
                    );

                    enemies.splice(
                        j,
                        1
                    );

                    updateEnemyHUD();

                }


                break;

            }

        }


        if(
            !hit &&
            bullet.userData.life<=0
        ){

            scene.remove(
                bullet
            );

            bullets.splice(
                i,
                1
            );

        }

    }
}


/* =====================================================
   ENEMY AI
===================================================== */

function updateEnemies(){

    if(!player)
        return;


    const now=
        performance.now();


    for(
        const enemy of enemies
    ){

        const dx=
            player.position.x-
            enemy.mesh.position.x;


        const dz=
            player.position.z-
            enemy.mesh.position.z;


        const distance=
            Math.sqrt(
                dx*dx+
                dz*dz
            );


        if(
            distance>5
        ){

            const s=.018;


            const nx=
                enemy.mesh.position.x+
                dx/distance*s;


            const nz=
                enemy.mesh.position.z+
                dz/distance*s;


            if(
                !wallCollision(
                    nx,
                    nz
                )
            ){

                enemy.mesh.position.x=
                    nx;

                enemy.mesh.position.z=
                    nz;

            }

        }


        enemy.mesh.lookAt(
            player.position.x,
            2,
            player.position.z
        );


        if(
            distance<45 &&
            now-enemy.cooldown>1500
        ){

            enemyShoot(
                enemy
            );

            enemy.cooldown=now;

        }


        enemy.mixer.update(
            clock.getDelta()
        );

    }
}


/* =====================================================
   ENEMY SHOOT
===================================================== */

function enemyShoot(
    enemy
){

    const bullet=
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .12,
                8,
                8
            ),

            new THREE.MeshBasicMaterial({
                color:0xff3333
            })

        );


    bullet.position.copy(
        enemy.mesh.position
    );

    bullet.position.y=2.2;


    const direction=
        new THREE.Vector3(
            player.position.x-
            bullet.position.x,

            2-
            bullet.position.y,

            player.position.z-
            bullet.position.z
        ).normalize();


    bullet.userData.velocity=
        direction.multiplyScalar(
            .4
        );


    bullet.userData.life=150;


    scene.add(bullet);

    enemyBullets.push(
        bullet
    );
}


/* =====================================================
   ENEMY BULLETS
===================================================== */

function updateEnemyBullets(){

    if(!player)
        return;


    for(
        let i=enemyBullets.length-1;
        i>=0;
        i--
    ){

        const bullet=
            enemyBullets[i];


        bullet.position.add(
            bullet.userData.velocity
        );


        bullet.userData.life--;


        const distance=
            bullet.position.distanceTo(
                player.position
            );


        if(
            distance<1.7
        ){

            health-=10;

            updateHealth();


            scene.remove(
                bullet
            );

            enemyBullets.splice(
                i,
                1
            );


            if(
                health<=0
            ){

                endGame();

            }


            continue;

        }


        if(
            bullet.userData.life<=0
        ){

            scene.remove(
                bullet
            );

            enemyBullets.splice(
                i,
                1
            );

        }

    }
}


/* =====================================================
   LOOT DETECTION
===================================================== */

function updateLootDetection(){

    if(!player)
        return;


    let closest=null;
    let closestDistance=3;


    for(
        const item of loot
    ){

        if(
            item.mesh.userData.taken
        )
            continue;


        const distance=
            item.mesh.position.distanceTo(
                player.position
            );


        if(
            distance<closestDistance
        ){

            closest=item;
            closestDistance=distance;

        }

    }


    nearbyLoot=closest;


    const interaction=
        document.getElementById(
            "interaction"
        );


    if(closest){

        interaction.style.display=
            "block";

        interaction.textContent=
            "E — PICK UP "+
            closest.label;

    }
    else{

        interaction.style.display=
            "none";

    }
}


/* =====================================================
   PICKUP
===================================================== */

function pickupLoot(){

    if(
        !nearbyLoot
    )
        return;


    const item=
        nearbyLoot;


    if(
        item.type==="ammo"
    ){

        ammo+=60;

        showLoot(
            "📦 +60 AMMO"
        );

    }


    else if(
        item.type==="medkit"
    ){

        health=
            Math.min(
                100,
                health+40
            );

        updateHealth();

        showLoot(
            "❤️ +40 HEALTH"
        );

    }


    else if(
        item.type==="weapon"
    ){

        magazine=30;

        ammo+=90;

        updateAmmo();

        showLoot(
            "🔫 WEAPON + AMMO"
        );

    }


    item.mesh.userData.taken=true;

    scene.remove(
        item.mesh
    );


    nearbyLoot=null;

    document.getElementById(
        "interaction"
    ).style.display="none";
}


/* =====================================================
   LOOT MESSAGE
===================================================== */

function showLoot(
    text
){

    const box=
        document.getElementById(
            "lootText"
        );


    box.textContent=text;

    box.style.display="block";


    setTimeout(
        ()=>{
            box.style.display="none";
        },
        1200
    );
}


/* =====================================================
   RELOAD
===================================================== */

function reload(){

    if(
        magazine>=30 ||
        ammo<=0
    )
        return;


    shooting=false;


    const need=
        30-magazine;


    const amount=
        Math.min(
            need,
            ammo
        );


    setTimeout(
        ()=>{

            magazine+=amount;

            ammo-=amount;

            updateAmmo();

        },
        800
    );
}


/* =====================================================
   HUD
===================================================== */

function updateHealth(){

    document.getElementById(
        "health"
    ).style.width=
        Math.max(
            0,
            health
        )+"%";
}


function updateAmmo(){

    document.getElementById(
        "ammo"
    ).textContent=
        "🔫 "+
        magazine+
        " / "+
        ammo;
}


function updateEnemyHUD(){

    document.getElementById(
        "enemyCount"
    ).textContent=
        "👾 ENEMIES: "+
        enemies.length;
}


/* =====================================================
   CONTROLS
===================================================== */

function setupControls(){

    window.addEventListener(
        "keydown",
        e=>{

            keys[
                e.key.toLowerCase()
            ]=true;


            if(
                e.key.toLowerCase()==="r"
            ){

                reload();

            }


            if(
                e.key.toLowerCase()==="e"
            ){

                pickupLoot();

            }

        }
    );


    window.addEventListener(
        "keyup",
        e=>{

            keys[
                e.key.toLowerCase()
            ]=false;

        }
    );


    renderer.domElement.addEventListener(
        "mousemove",
        e=>{

            if(
                document.pointerLockElement===
                renderer.domElement
            ){

                yaw-=
                    e.movementX*.0025;


                pitch-=
                    e.movementY*.002;


                pitch=
                    Math.max(
                        -.4,
                        Math.min(
                            .65,
                            pitch
                        )
                    );

            }

        }
    );


    renderer.domElement.addEventListener(
        "mousedown",
        e=>{

            if(
                e.button===0
            ){

                shooting=true;

                shoot();

            }

        }
    );


    window.addEventListener(
        "mouseup",
        e=>{

            if(
                e.button===0
            ){

                shooting=false;

            }

        }
    );


    document.getElementById(
        "startButton"
    ).onclick=()=>{

        running=true;

        document.getElementById(
            "startScreen"
        ).style.display="none";


        if(
            innerWidth>800
        ){

            renderer.domElement
                .requestPointerLock();

        }

    };


    /* MOBILE JOYSTICK */

    const joy=
        document.getElementById(
            "joystick"
        );

    const stick=
        document.getElementById(
            "stick"
        );


    let active=false;


    joy.addEventListener(
        "touchstart",
        e=>{

            active=true;

            e.preventDefault();

        },
        {
            passive:false
        }
    );


    joy.addEventListener(
        "touchmove",
        e=>{

            if(!active)
                return;


            const rect=
                joy.getBoundingClientRect();


            const touch=
                e.touches[0];


            let dx=
                touch.clientX-
                (
                    rect.left+
                    rect.width/2
                );


            let dy=
                touch.clientY-
                (
                    rect.top+
                    rect.height/2
                );


            const max=45;


            const len=
                Math.sqrt(
                    dx*dx+
                    dy*dy
                );


            if(
                len>max
            ){

                dx=
                    dx/len*max;

                dy=
                    dy/len*max;

            }


            joystickX=
                dx/max;

            joystickY=
                dy/max;


            stick.style.left=
                (38+dx)+"px";

            stick.style.top=
                (38+dy)+"px";


            e.preventDefault();

        },
        {
            passive:false
        }
    );


    joy.addEventListener(
        "touchend",
        ()=>{

            active=false;

            joystickX=0;
            joystickY=0;

            stick.style.left=
                "38px";

            stick.style.top=
                "38px";

        }
    );


    /* FIRE */

    const fire=
        document.getElementById(
            "fireButton"
        );


    fire.addEventListener(
        "touchstart",
        e=>{

            shooting=true;

            shoot();

            e.preventDefault();

        },
        {
            passive:false
        }
    );


    fire.addEventListener(
        "touchend",
        ()=>{

            shooting=false;

        }
    );


    /* RELOAD */

    document.getElementById(
        "reloadButton"
    ).addEventListener(
        "touchstart",
        e=>{

            reload();

            e.preventDefault();

        },
        {
            passive:false
        }
    );


    /* LOOT */

    document.getElementById(
        "lootButton"
    ).addEventListener(
        "touchstart",
        e=>{

            pickupLoot();

            e.preventDefault();

        },
        {
            passive:false
        }
    );
}


/* =====================================================
   GAME OVER
===================================================== */

function endGame(){

    if(gameFinished)
        return;


    gameFinished=true;

    running=false;

    shooting=false;


    document.getElementById(
        "gameOver"
    ).style.display=
        "flex";
}


/* =====================================================
   ANIMATION LOOP
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    const dt=
        clock.getDelta();


    if(
        running &&
        !gameFinished
    ){

        if(playerMixer)
            playerMixer.update(dt);


        updatePlayer();

        updateCamera();

        updateBullets();

        updateEnemies();

        updateEnemyBullets();

        updateLootDetection();


        if(shooting)
            shoot();

    }


    renderer.render(
        scene,
        camera
    );
}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* START */

init();

</script>
