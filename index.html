<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Amar Battleground 3D</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
}

#hud{
    position:fixed;
    top:15px;
    left:15px;
    color:white;
    z-index:10;
    text-shadow:0 2px 4px #000;
    pointer-events:none;
}

#healthBox{
    width:220px;
    height:22px;
    border:2px solid white;
    background:#222;
    margin-top:5px;
}

#health{
    height:100%;
    width:100%;
    background:#20d060;
}

#ammo{
    margin-top:8px;
    font-size:22px;
    font-weight:bold;
}

#enemyCount{
    margin-top:5px;
    font-size:17px;
}

#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:30px;
    z-index:20;
    pointer-events:none;
}

#startScreen{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.82);
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:white;
}

#startBox{
    width:min(90%,420px);
    padding:30px;
    border-radius:18px;
    background:rgba(20,20,20,.95);
    box-shadow:0 0 30px #000;
}

#startBox h1{
    font-size:38px;
    margin-bottom:10px;
}

#startBox p{
    line-height:1.6;
    color:#ccc;
    margin-bottom:20px;
}

#startBtn{
    border:0;
    background:#e63946;
    color:white;
    padding:15px 40px;
    border-radius:10px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

#reloadText{
    position:fixed;
    left:50%;
    bottom:80px;
    transform:translateX(-50%);
    color:white;
    font-size:22px;
    font-weight:bold;
    display:none;
    z-index:30;
}

#gameOver{
    display:none;
    position:fixed;
    inset:0;
    z-index:200;
    background:rgba(0,0,0,.75);
    color:white;
    align-items:center;
    justify-content:center;
    text-align:center;
}

#gameOver h1{
    font-size:50px;
    margin-bottom:20px;
}

#restart{
    padding:14px 35px;
    font-size:20px;
    border:0;
    border-radius:10px;
    background:#e63946;
    color:white;
}

#mobileControls{
    display:none;
    position:fixed;
    inset:0;
    z-index:50;
    pointer-events:none;
}

#joystick{
    position:absolute;
    left:30px;
    bottom:35px;
    width:130px;
    height:130px;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    border:2px solid rgba(255,255,255,.35);
    pointer-events:auto;
}

#stick{
    position:absolute;
    width:55px;
    height:55px;
    left:37px;
    top:37px;
    border-radius:50%;
    background:rgba(255,255,255,.5);
}

.mobileBtn{
    position:absolute;
    pointer-events:auto;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.5);
    color:white;
    background:rgba(0,0,0,.45);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    user-select:none;
}

#fire{
    width:90px;
    height:90px;
    right:35px;
    bottom:45px;
    background:rgba(200,0,0,.55);
}

#reload{
    width:65px;
    height:65px;
    right:120px;
    bottom:125px;
}

@media(max-width:800px){
    #mobileControls{
        display:block;
    }

    #hud{
        transform:scale(.85);
        transform-origin:top left;
    }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
    <div>❤️ HEALTH</div>
    <div id="healthBox">
        <div id="health"></div>
    </div>

    <div id="ammo">🔫 30 / 120</div>
    <div id="enemyCount">👾 ENEMIES: 10</div>
</div>

<div id="crosshair">+</div>

<div id="reloadText">RELOADING...</div>

<div id="startScreen">
    <div id="startBox">
        <h1>AMAR BATTLEGROUND</h1>
        <p>
            3D Battle Royale Prototype<br><br>
            PC: WASD = Move<br>
            Mouse = Aim<br>
            Left Click = Shoot<br>
            R = Reload
        </p>

        <button id="startBtn">START GAME</button>
    </div>
</div>

<div id="gameOver">
    <div>
        <h1>GAME OVER</h1>
        <button id="restart">PLAY AGAIN</button>
    </div>
</div>

<div id="mobileControls">
    <div id="joystick">
        <div id="stick"></div>
    </div>

    <div id="reload" class="mobileBtn">R</div>
    <div id="fire" class="mobileBtn">FIRE</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene;
let camera;
let renderer;
let clock;

let player;
let playerGroup;

let enemies=[];
let bullets=[];
let enemyBullets=[];

let buildings=[];
let trees=[];

let running=false;
let gameOver=false;

let keys={};

let yaw=0;
let pitch=0;

let mouseX=0;
let mouseY=0;

let ammo=30;
let reserveAmmo=120;
let health=100;

let shooting=false;
let lastShot=0;

const MAGAZINE=30;

const playerSpeed=0.13;

let joystickX=0;
let joystickY=0;

let raycaster=new THREE.Raycaster();

const worldSize=180;





/* =========================
   SCENE
========================= */

function init(){

    scene=new THREE.Scene();

    scene.background=new THREE.Color(0x87b9e8);

    scene.fog=new THREE.Fog(0x87b9e8,70,220);


    camera=new THREE.PerspectiveCamera(
        70,
        innerWidth/innerHeight,
        .1,
        500
    );


    renderer=new THREE.WebGLRenderer({
        antialias:true
    });

    renderer.setPixelRatio(Math.min(devicePixelRatio,2));

    renderer.setSize(innerWidth,innerHeight);

    renderer.shadowMap.enabled=true;

    document.getElementById("game").appendChild(renderer.domElement);


    clock=new THREE.Clock();


    /* LIGHT */

    const hemi=new THREE.HemisphereLight(
        0xffffff,
        0x52633d,
        2
    );

    scene.add(hemi);


    const sun=new THREE.DirectionalLight(
        0xffffff,
        2
    );

    sun.position.set(50,100,30);

    sun.castShadow=true;

    scene.add(sun);


    createMap();

    createPlayer();

    createEnemies(10);


    window.addEventListener("resize",resize);

    setupKeyboard();

    setupMouse();

    setupMobile();

    animate();
}





/* =========================
   MAP
========================= */

function createMap(){

    const groundGeo=new THREE.PlaneGeometry(
        worldSize,
        worldSize
    );

    const groundMat=new THREE.MeshStandardMaterial({
        color:0x4d873f
    });

    const ground=new THREE.Mesh(
        groundGeo,
        groundMat
    );

    ground.rotation.x=-Math.PI/2;

    ground.receiveShadow=true;

    scene.add(ground);


    /* ROAD */

    const roadMat=new THREE.MeshStandardMaterial({
        color:0x4b4b4b
    });


    const road1=new THREE.Mesh(
        new THREE.PlaneGeometry(worldSize,14),
        roadMat
    );

    road1.rotation.x=-Math.PI/2;

    road1.position.y=.02;

    scene.add(road1);


    const road2=new THREE.Mesh(
        new THREE.PlaneGeometry(14,worldSize),
        roadMat
    );

    road2.rotation.x=-Math.PI/2;

    road2.position.y=.03;

    scene.add(road2);


    /* BUILDINGS */

    const locations=[
        [-55,-50,20,14],
        [-25,-55,15,12],
        [35,-50,18,14],
        [60,-20,15,18],
        [-55,20,18,15],
        [-25,45,20,15],
        [40,35,18,16],
        [60,65,15,12],
        [-65,65,15,12]
    ];


    locations.forEach(p=>{
        createBuilding(
            p[0],
            p[1],
            p[2],
            p[3]
        );
    });


    /* TREES */

    for(let i=0;i<80;i++){

        let x=(Math.random()-.5)*160;
        let z=(Math.random()-.5)*160;

        if(Math.abs(x)<10 || Math.abs(z)<10)
            continue;

        createTree(x,z);
    }
}





/* =========================
   BUILDING
========================= */

function createBuilding(x,z,w,d){

    const h=5+Math.random()*4;

    const body=new THREE.Mesh(

        new THREE.BoxGeometry(w,h,d),

        new THREE.MeshStandardMaterial({
            color:0xb9a58d
        })

    );

    body.position.set(
        x,
        h/2,
        z
    );

    body.castShadow=true;
    body.receiveShadow=true;

    scene.add(body);

    buildings.push(body);


    /* roof */

    const roof=new THREE.Mesh(

        new THREE.BoxGeometry(
            w+1,
            .7,
            d+1
        ),

        new THREE.MeshStandardMaterial({
            color:0x5b3a2c
        })

    );

    roof.position.set(
        x,
        h+.35,
        z
    );

    roof.castShadow=true;

    scene.add(roof);
}





/* =========================
   TREE
========================= */

function createTree(x,z){

    const group=new THREE.Group();


    const trunk=new THREE.Mesh(

        new THREE.CylinderGeometry(
            .45,
            .6,
            4,
            8
        ),

        new THREE.MeshStandardMaterial({
            color:0x654321
        })

    );

    trunk.position.y=2;

    trunk.castShadow=true;

    group.add(trunk);


    const leaves=new THREE.Mesh(

        new THREE.SphereGeometry(
            2.8,
            8,
            8
        ),

        new THREE.MeshStandardMaterial({
            color:0x1d6428
        })

    );

    leaves.position.y=5;

    leaves.castShadow=true;

    group.add(leaves);


    group.position.set(x,0,z);

    scene.add(group);

    trees.push(group);
}





/* =========================
   PLAYER
========================= */

function createPlayer(){

    playerGroup=new THREE.Group();


    /* body */

    const body=new THREE.Mesh(

        new THREE.BoxGeometry(
            1.1,
            1.6,
            .7
        ),

        new THREE.MeshStandardMaterial({
            color:0x26384c
        })

    );

    body.position.y=2.1;

    body.castShadow=true;

    playerGroup.add(body);


    /* head */

    const head=new THREE.Mesh(

        new THREE.SphereGeometry(
            .42,
            16,
            16
        ),

        new THREE.MeshStandardMaterial({
            color:0xc58b62
        })

    );

    head.position.y=3.2;

    head.castShadow=true;

    playerGroup.add(head);


    /* helmet */

    const helmet=new THREE.Mesh(

        new THREE.SphereGeometry(
            .47,
            16,
            16,
            0,
            Math.PI*2,
            0,
            Math.PI/2
        ),

        new THREE.MeshStandardMaterial({
            color:0x182b24
        })

    );

    helmet.position.y=3.3;

    playerGroup.add(helmet);


    /* gun */

    const gun=new THREE.Mesh(

        new THREE.BoxGeometry(
            .18,
            .18,
            1.5
        ),

        new THREE.MeshStandardMaterial({
            color:0x171717
        })

    );

    gun.position.set(
        .55,
        2.4,
        -.7
    );

    playerGroup.add(gun);


    playerGroup.position.set(
        0,
        0,
        0
    );


    scene.add(playerGroup);

    player={
        x:0,
        z:0
    };
}





/* =========================
   ENEMIES
========================= */

function createEnemies(count){

    for(let i=0;i<count;i++){

        let x;
        let z;

        do{

            x=(Math.random()-.5)*150;
            z=(Math.random()-.5)*150;

        }while(
            Math.sqrt(x*x+z*z)<25
        );


        const enemy=createEnemy();

        enemy.position.set(
            x,
            0,
            z
        );

        scene.add(enemy);

        enemies.push({
            mesh:enemy,
            hp:100,
            cooldown:Math.random()*2000
        });
    }

    updateEnemyText();
}





function createEnemy(){

    const group=new THREE.Group();


    const body=new THREE.Mesh(

        new THREE.BoxGeometry(
            1.1,
            1.6,
            .7
        ),

        new THREE.MeshStandardMaterial({
            color:0x9d2525
        })

    );

    body.position.y=2.1;

    body.castShadow=true;

    group.add(body);


    const head=new THREE.Mesh(

        new THREE.SphereGeometry(
            .42,
            16,
            16
        ),

        new THREE.MeshStandardMaterial({
            color:0xc58b62
        })

    );

    head.position.y=3.2;

    head.castShadow=true;

    group.add(head);


    const gun=new THREE.Mesh(

        new THREE.BoxGeometry(
            .18,
            .18,
            1.5
        ),

        new THREE.MeshStandardMaterial({
            color:0x111111
        })

    );

    gun.position.set(
        .55,
        2.4,
        -.7
    );

    group.add(gun);


    return group;
}





/* =========================
   KEYBOARD
========================= */

function setupKeyboard(){

    window.addEventListener("keydown",e=>{

        keys[e.key.toLowerCase()]=true;

        if(e.key.toLowerCase()==="r"){
            reload();
        }

    });


    window.addEventListener("keyup",e=>{

        keys[e.key.toLowerCase()]=false;

    });
}





/* =========================
   MOUSE
========================= */

function setupMouse(){

    renderer.domElement.addEventListener(
        "mousemove",
        e=>{

            if(!running)
                return;

            if(document.pointerLockElement===renderer.domElement){

                yaw-=e.movementX*.0025;

                pitch-=e.movementY*.002;

                pitch=Math.max(
                    -.6,
                    Math.min(.5,pitch)
                );

            }

        }
    );


    renderer.domElement.addEventListener(
        "mousedown",
        e=>{

            if(e.button===0){

                shooting=true;

                shoot();

            }

        }
    );


    window.addEventListener(
        "mouseup",
        e=>{

            if(e.button===0)
                shooting=false;

        }
    );
}





/* =========================
   MOBILE
========================= */

function setupMobile(){

    const joystick=document.getElementById("joystick");
    const stick=document.getElementById("stick");

    let active=false;

    joystick.addEventListener(
        "touchstart",
        e=>{
            active=true;
            e.preventDefault();
        },
        {passive:false}
    );


    joystick.addEventListener(
        "touchmove",
        e=>{

            if(!active)
                return;

            const rect=joystick.getBoundingClientRect();

            const touch=e.touches[0];

            let dx=
                touch.clientX-
                (rect.left+rect.width/2);

            let dy=
                touch.clientY-
                (rect.top+rect.height/2);


            const max=45;

            const len=Math.sqrt(
                dx*dx+dy*dy
            );

            if(len>max){

                dx=dx/len*max;
                dy=dy/len*max;

            }


            stick.style.left=
                (37+dx)+"px";

            stick.style.top=
                (37+dy)+"px";


            joystickX=dx/max;

            joystickY=dy/max;

            e.preventDefault();

        },
        {passive:false}
    );


    joystick.addEventListener(
        "touchend",
        ()=>{

            active=false;

            joystickX=0;
            joystickY=0;

            stick.style.left="37px";
            stick.style.top="37px";

        }
    );


    const fire=document.getElementById("fire");


    fire.addEventListener(
        "touchstart",
        e=>{

            shooting=true;

            shoot();

            e.preventDefault();

        },
        {passive:false}
    );


    fire.addEventListener(
        "touchend",
        ()=>{

            shooting=false;

        }
    );


    document.getElementById("reload")
        .addEventListener(
            "touchstart",
            e=>{

                reload();

                e.preventDefault();

            },
            {passive:false}
        );
}





/* =========================
   MOVEMENT
========================= */

function updatePlayer(){

    let forward=0;
    let right=0;


    if(keys["w"])
        forward+=1;

    if(keys["s"])
        forward-=1;

    if(keys["d"])
        right+=1;

    if(keys["a"])
        right-=1;


    forward+=-joystickY;
    right+=joystickX;


    const len=Math.sqrt(
        forward*forward+
        right*right
    );


    if(len>0){

        forward/=len;
        right/=len;


        const speed=playerSpeed;


        const dx=
            Math.sin(yaw)*forward+
            Math.cos(yaw)*right;

        const dz=
            Math.cos(yaw)*forward-
            Math.sin(yaw)*right;


        const nx=
            playerGroup.position.x+
            dx*speed;

        const nz=
            playerGroup.position.z+
            dz*speed;


        if(!collisionWithBuildings(nx,nz)){

            playerGroup.position.x=nx;
            playerGroup.position.z=nz;

        }


        playerGroup.rotation.y=yaw;

    }
}





/* =========================
   COLLISION
========================= */

function collisionWithBuildings(x,z){

    const r=.7;


    for(const b of buildings){

        const box=new THREE.Box3()
            .setFromObject(b);


        if(
            x>box.min.x-r &&
            x<box.max.x+r &&
            z>box.min.z-r &&
            z<box.max.z+r
        ){

            return true;

        }

    }


    return false;
}





/* =========================
   CAMERA
========================= */

function updateCamera(){

    const distance=7;

    const height=4;


    const offsetX=
        Math.sin(yaw)*distance;

    const offsetZ=
        Math.cos(yaw)*distance;


    camera.position.set(

        playerGroup.position.x+
        offsetX,

        playerGroup.position.y+
        height+
        pitch*3,

        playerGroup.position.z+
        offsetZ

    );


    const target=new THREE.Vector3(

        playerGroup.position.x,

        2.1,

        playerGroup.position.z

    );


    camera.lookAt(target);
}





/* =========================
   SHOOT
========================= */

function shoot(){

    if(!running || gameOver)
        return;


    const now=performance.now();


    if(now-lastShot<160)
        return;


    if(ammo<=0){

        reload();

        return;

    }


    lastShot=now;

    ammo--;

    updateAmmo();


    const bulletGeo=
        new THREE.SphereGeometry(
            .12,
            8,
            8
        );


    const bulletMat=
        new THREE.MeshBasicMaterial({
            color:0xffff00
        });


    const bullet=
        new THREE.Mesh(
            bulletGeo,
            bulletMat
        );


    const start=
        new THREE.Vector3();


    start.copy(
        playerGroup.position
    );

    start.y=2.4;


    bullet.position.copy(start);


    const direction=
        new THREE.Vector3();


    camera.getWorldDirection(
        direction
    );


    bullet.userData={
        velocity:
            direction.multiplyScalar(.9),
        life:120,
        damage:50
    };


    scene.add(bullet);

    bullets.push(bullet);
}





/* =========================
   PLAYER BULLETS
========================= */

function updateBullets(){

    for(let i=bullets.length-1;i>=0;i--){

        const b=bullets[i];

        b.position.add(
            b.userData.velocity
        );

        b.userData.life--;


        let hit=false;


        for(let j=enemies.length-1;j>=0;j--){

            const e=enemies[j];

            const distance=
                b.position.distanceTo(
                    e.mesh.position
                );


            if(distance<2){

                e.hp-=50;

                scene.remove(b);

                bullets.splice(i,1);

                hit=true;


                if(e.hp<=0){

                    scene.remove(
                        e.mesh
                    );

                    enemies.splice(j,1);

                    updateEnemyText();

                }

                break;

            }

        }


        if(!hit &&
            b.userData.life<=0){

            scene.remove(b);

            bullets.splice(i,1);

        }

    }
}





/* =========================
   ENEMIES
========================= */

function updateEnemies(){

    const now=performance.now();


    enemies.forEach(e=>{

        const pos=e.mesh.position;

        const dx=
            playerGroup.position.x-
            pos.x;

        const dz=
            playerGroup.position.z-
            pos.z;


        const distance=
            Math.sqrt(dx*dx+dz*dz);


        if(distance>3){

            const speed=.025;

            const nx=
                pos.x+
                dx/distance*speed;

            const nz=
                pos.z+
                dz/distance*speed;


            if(!collisionWithBuildings(nx,nz)){

                pos.x=nx;
                pos.z=nz;

            }

        }


        e.mesh.lookAt(
            playerGroup.position.x,
            2,
            playerGroup.position.z
        );


        if(
            distance<45 &&
            now-e.cooldown>1300
        ){

            enemyShoot(e);

            e.cooldown=now;

        }

    });
}





/* =========================
   ENEMY SHOOT
========================= */

function enemyShoot(enemy){

    const bulletGeo=
        new THREE.SphereGeometry(
            .13,
            8,
            8
        );


    const bulletMat=
        new THREE.MeshBasicMaterial({
            color:0xff4444
        });


    const bullet=
        new THREE.Mesh(
            bulletGeo,
            bulletMat
        );


    bullet.position.copy(
        enemy.mesh.position
    );

    bullet.position.y=2.3;


    const direction=
        new THREE.Vector3(
            playerGroup.position.x-
            bullet.position.x,

            2-
            bullet.position.y,

            playerGroup.position.z-
            bullet.position.z
        ).normalize();


    bullet.userData={
        velocity:
            direction.multiplyScalar(.45),
        life:160
    };


    scene.add(bullet);

    enemyBullets.push(bullet);
}





/* =========================
   ENEMY BULLETS
========================= */

function updateEnemyBullets(){

    for(
        let i=enemyBullets.length-1;
        i>=0;
        i--
    ){

        const b=enemyBullets[i];

        b.position.add(
            b.userData.velocity
        );

        b.userData.life--;


        const distance=
            b.position.distanceTo(
                playerGroup.position
            );


        if(distance<1.7){

            health-=10;

            updateHealth();

            scene.remove(b);

            enemyBullets.splice(i,1);

            if(health<=0){

                endGame();

            }

            continue;

        }


        if(b.userData.life<=0){

            scene.remove(b);

            enemyBullets.splice(i,1);

        }

    }
}





/* =========================
   RELOAD
========================= */

function reload(){

    if(ammo===MAGAZINE)
        return;

    if(reserveAmmo<=0)
        return;


    document.getElementById(
        "reloadText"
    ).style.display="block";


    setTimeout(()=>{

        const needed=
            MAGAZINE-ammo;

        const amount=
            Math.min(
                needed,
                reserveAmmo
            );


        ammo+=amount;

        reserveAmmo-=amount;

        updateAmmo();


        document.getElementById(
            "reloadText"
        ).style.display="none";

    },1000);
}





/* =========================
   HUD
========================= */

function updateAmmo(){

    document.getElementById(
        "ammo"
    ).textContent=
        "🔫 "+
        ammo+
        " / "+
        reserveAmmo;
}


function updateHealth(){

    document.getElementById(
        "health"
    ).style.width=
        Math.max(0,health)+"%";
}


function updateEnemyText(){

    document.getElementById(
        "enemyCount"
    ).textContent=
        "👾 ENEMIES: "+
        enemies.length;
}





/* =========================
   GAME OVER
========================= */

function endGame(){

    if(gameOver)
        return;

    gameOver=true;

    running=false;

    shooting=false;

    document.getElementById(
        "gameOver"
    ).style.display="flex";

}





/* =========================
   START
========================= */

function startGame(){

    running=true;

    gameOver=false;

    health=100;

    ammo=30;

    reserveAmmo=120;

    updateHealth();

    updateAmmo();


    document.getElementById(
        "startScreen"
    ).style.display="none";


    if(innerWidth>800){

        renderer.domElement.requestPointerLock();

    }

}





/* =========================
   RESTART
========================= */

function restartGame(){

    location.reload();

}





/* =========================
   UPDATE
========================= */

function update(){

    if(!running)
        return;


    updatePlayer();

    updateCamera();

    updateEnemies();

    updateBullets();

    updateEnemyBullets();


    if(shooting)
        shoot();

}





/* =========================
   LOOP
========================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    update();

    renderer.render(
        scene,
        camera
    );

}





/* =========================
   RESIZE
========================= */

function resize(){

    camera.aspect=
        innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );

}





/* =========================
   BUTTONS
========================= */

document.getElementById(
    "startBtn"
).onclick=startGame;


document.getElementById(
    "restart"
).onclick=restartGame;


/* START */

init();

</script>

</body>
</html>
