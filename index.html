<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Amar Battleground v0.3</title>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#101712;
font-family:Arial,sans-serif;
touch-action:none;
}

canvas{
display:block;
width:100vw;
height:100vh;
background:#385b35;
}

#hud{
position:fixed;
top:10px;
left:12px;
color:#fff;
font-weight:bold;
font-size:16px;
text-shadow:2px 2px 3px #000;
z-index:5;
}

#bar{
position:fixed;
top:38px;
left:12px;
width:190px;
height:12px;
background:#222;
border:1px solid #fff8;
border-radius:7px;
overflow:hidden;
z-index:5;
}

#health{
height:100%;
width:100%;
background:#45c75a;
}

#help{
position:fixed;
bottom:8px;
left:50%;
transform:translateX(-50%);
background:#0009;
color:#fff;
padding:6px 10px;
border-radius:8px;
font-size:12px;
z-index:5;
}

#start{
position:fixed;
inset:0;
display:grid;
place-items:center;
background:#000b;
z-index:20;
color:#fff;
}

.panel{
background:#182018;
padding:28px;
border-radius:16px;
text-align:center;
box-shadow:0 12px 40px #000;
}

.panel button{
font-size:18px;
padding:12px 24px;
border:0;
border-radius:10px;
cursor:pointer;
}

#joy{
position:fixed;
left:22px;
bottom:30px;
width:130px;
height:130px;
border:3px solid #ffffff66;
border-radius:50%;
background:#ffffff18;
z-index:10;
display:none;
}

#knob{
position:absolute;
left:40px;
top:40px;
width:50px;
height:50px;
border-radius:50%;
background:#ffffff77;
}

#fire{
position:fixed;
right:25px;
bottom:40px;
width:90px;
height:90px;
border-radius:50%;
border:3px solid #fff9;
background:#d33b3baa;
color:#fff;
font-weight:bold;
font-size:17px;
z-index:10;
display:none;
}

#reload{
position:fixed;
right:135px;
bottom:50px;
border:2px solid #fff8;
border-radius:12px;
background:#0008;
color:#fff;
padding:11px;
z-index:10;
display:none;
}

@media(max-width:700px){

#joy,
#fire,
#reload{
display:block;
}

#help{
display:none;
}

}

</style>
</head>

<body>

<canvas id="game"></canvas>


<div id="hud">

HP:
<span id="hp">100</span>

|

Enemies:
<span id="enemies">8</span>

|

Ammo:
<span id="ammo">30</span>

|

Weapon:
<span id="weapon">RIFLE</span>

|

Loot:
<span id="loot">0</span>

</div>


<div id="bar">
<div id="health"></div>
</div>


<div id="help">
WASD / joystick = move · Mouse = aim · Click/FIRE = shoot · R = reload · E = collect loot
</div>


<div id="joy">

<div id="knob"></div>

</div>


<button id="fire">
FIRE
</button>


<button id="reload">
RELOAD
</button>


<div id="start">

<div class="panel">

<h1>
AMAR BATTLEGROUND
</h1>

<p>
Version 0.3 — Map & Loot
</p>

<button id="startBtn">
START GAME
</button>

</div>

</div>


<script>


/* =========================
   CANVAS
========================= */

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

let W =
window.innerWidth;

let H =
window.innerHeight;

canvas.width = W;
canvas.height = H;


/* =========================
   RESIZE
========================= */

window.addEventListener(
"resize",
function(){

W =
window.innerWidth;

H =
window.innerHeight;

canvas.width = W;
canvas.height = H;

}
);


/* =========================
   PLAYER
========================= */

let player = {

x: W / 2,

y: H / 2,

r: 16,

hp: 100,

speed: 3.1

};


/* =========================
   GAME VARIABLES
========================= */

let enemies = [];

let bullets = [];

let enemyBullets = [];

let buildings = [];

let lootBoxes = [];

let keys = {};

let running = false;

let gameOver = false;

let ammo = 30;

let lastShot = 0;

let lootCount = 0;

let joystickX = 0;

let joystickY = 0;


let mouse = {

x: W / 2,

y: H / 2,

down: false

};


/* =========================
   HUD
========================= */

const hpElement =
document.getElementById("hp");

const enemyElement =
document.getElementById("enemies");

const ammoElement =
document.getElementById("ammo");

const healthElement =
document.getElementById("health");

const lootElement =
document.getElementById("loot");


function updateHUD(){

hpElement.textContent =
Math.max(
0,
Math.ceil(player.hp)
);

enemyElement.textContent =
enemies.length;

ammoElement.textContent =
ammo;

lootElement.textContent =
lootCount;

healthElement.style.width =
Math.max(
0,
player.hp
) + "%";

}


/* =========================
   KEYBOARD
========================= */

window.addEventListener(
"keydown",
function(e){

keys[
e.key.toLowerCase()
] = true;


/* reload */

if(
e.key.toLowerCase() === "r"
){

ammo = 30;

}


/* loot */

if(
e.key.toLowerCase() === "e"
){

collectLoot();

}


/* restart */

if(
e.key === "Enter" &&
gameOver
){

resetGame();

}

});


window.addEventListener(
"keyup",
function(e){

keys[
e.key.toLowerCase()
] = false;

});


/* =========================
   MOUSE
========================= */

canvas.addEventListener(
"mousemove",
function(e){

mouse.x =
e.clientX;

mouse.y =
e.clientY;

});


canvas.addEventListener(
"mousedown",
function(){

mouse.down = true;

});


window.addEventListener(
"mouseup",
function(){

mouse.down = false;

});


/* =========================
   MAP
========================= */

function makeMap(){

buildings = [

{
x:80,
y:110,
w:170,
h:105
},

{
x:W-260,
y:100,
w:180,
h:120
},

{
x:W/2-90,
y:95,
w:180,
h:90
},

{
x:90,
y:H-210,
w:210,
h:110
},

{
x:W-300,
y:H-220,
w:210,
h:120
},

{
x:W/2-120,
y:H-190,
w:240,
h:100
}

];


lootBoxes = [

{
x:300,
y:270,
taken:false
},

{
x:W-330,
y:270,
taken:false
},

{
x:W/2+240,
y:H/2-100,
taken:false
},

{
x:W/2-280,
y:H/2+130,
taken:false
},

{
x:W/2,
y:H-280,
taken:false
}

];

}


/* =========================
   BUILDING COLLISION
========================= */

function insideBuilding(
x,
y,
r=0
){

return buildings.some(
function(b){

return (

x+r > b.x &&

x-r <
b.x + b.w &&

y+r > b.y &&

y-r <
b.y + b.h

);

});

}


/* =========================
   ENEMY SPAWN
========================= */

function spawnEnemies(){

enemies = [];


for(
let i=0;
i<8;
i++
){

let enemy;


do{

enemy = {

x:
40 +
Math.random() *
(W - 80),

y:
70 +
Math.random() *
(H - 100),

r:15,

hp:60,

speed:1.0

};

}
while(

Math.hypot(
enemy.x-player.x,
enemy.y-player.y
) < 180

||

insideBuilding(
enemy.x,
enemy.y,
enemy.r
)

);


enemies.push(
enemy
);

}

}


/* =========================
   RESET GAME
========================= */

function resetGame(){

player = {

x: W / 2,

y: H / 2,

r: 16,

hp: 100,

speed: 3.1

};


bullets = [];

enemyBullets = [];

ammo = 30;

lootCount = 0;

gameOver = false;


makeMap();

spawnEnemies();

updateHUD();

}


/* =========================
   COLLECT LOOT
========================= */

function collectLoot(){

for(
const box of lootBoxes
){

if(

!box.taken &&

Math.hypot(
box.x-player.x,
box.y-player.y
) < 45

){

box.taken = true;

lootCount++;

ammo =
Math.min(
60,
ammo + 15
);

}

}

updateHUD();

}


/* =========================
   START GAME
========================= */

document
.getElementById("startBtn")
.addEventListener(
"click",
function(){

document
.getElementById("start")
.style.display =
"none";

running = true;

resetGame();

}
);


/* =========================
   SHOOT
========================= */

function shoot(){

if(
!running ||
gameOver ||
ammo <= 0
){

return;

}


const now =
performance.now();


if(
now-lastShot < 150
){

return;

}


lastShot = now;

ammo--;


const angle =
Math.atan2(

mouse.y -
player.y,

mouse.x -
player.x

);


bullets.push({

x: player.x,

y: player.y,

vx:
Math.cos(angle) * 10,

vy:
Math.sin(angle) * 10

});

}


/* =========================
   COLLISION
========================= */

function hit(a,b){

return Math.hypot(

a.x-b.x,

a.y-b.y

)
<
a.r+b.r;

}


/* =========================
   MOVE WITH WALLS
========================= */

function moveWithWalls(
obj,
dx,
dy
){

const newX =
obj.x + dx;

const newY =
obj.y + dy;


if(

newX > 20 &&

newX < W-20 &&

!insideBuilding(
newX,
obj.y,
obj.r
)

){

obj.x =
newX;

}


if(

newY > 50 &&

newY < H-20 &&

!insideBuilding(
obj.x,
newY,
obj.r
)

){

obj.y =
newY;

}

}


/* =========================
   UPDATE
========================= */

function update(){

if(
!running ||
gameOver
){

return;

}


/* movement */

let dx =

(keys.d ? 1 : 0)

-

(keys.a ? 1 : 0)

+

joystickX;


let dy =

(keys.s ? 1 : 0)

-

(keys.w ? 1 : 0)

+

joystickY;


let length =
Math.hypot(
dx,
dy
);


if(
length > 1
){

dx /=
length;

dy /=
length;

}


moveWithWalls(

player,

dx *
player.speed,

dy *
player.speed

);


/* shooting */

if(
mouse.down
){

shoot();

}


/* bullets */

for(
const bullet of bullets
){

bullet.x +=
bullet.vx;

bullet.y +=
bullet.vy;

}


bullets =
bullets.filter(
function(b){

return (

b.x > -30 &&

b.x < W+30 &&

b.y > -30 &&

b.y < H+30

);

});


/* enemies */

for(
const enemy of enemies
){

const angle =
Math.atan2(

player.y -
enemy.y,

player.x -
enemy.x

);


const distance =
Math.hypot(

player.x -
enemy.x,

player.y -
enemy.y

);


if(
distance > 100
){

const nx =
enemy.x +
Math.cos(angle) *
enemy.speed;

const ny =
enemy.y +
Math.sin(angle) *
enemy.speed;


if(
!insideBuilding(
nx,
enemy.y,
enemy.r
)
){

enemy.x =
nx;

}


if(
!insideBuilding(
enemy.x,
ny,
enemy.r
)
){

enemy.y =
ny;

}

}
else{

player.hp -=
0.05;

}

}


/* enemy shooting */

if(
Math.random() <
0.018
){

for(
const enemy of enemies
){

const angle =
Math.atan2(

player.y -
enemy.y,

player.x -
enemy.x

);


enemyBullets.push({

x: enemy.x,

y: enemy.y,

vx:
Math.cos(angle) * 4,

vy:
Math.sin(angle) * 4,

r:4

});

}

}


/* enemy bullets */

for(
const bullet of enemyBullets
){

bullet.x +=
bullet.vx;

bullet.y +=
bullet.vy;


if(
hit(
bullet,
player
)
){

player.hp -=
6;

bullet.x =
-999;

}

}


enemyBullets =
enemyBullets.filter(
function(b){

return (

b.x > -50 &&

b.x < W+50 &&

b.y > -50 &&

b.y < H+50

);

});


/* bullet hit */

for(
const bullet of bullets
){

for(
const enemy of enemies
){

if(

enemy.hp > 0 &&

hit(
bullet,
enemy
)

){

enemy.hp -=
30;

bullet.x =
-999;

}

}

}


/* remove dead */

enemies =
enemies.filter(
function(enemy){

return enemy.hp > 0;

});


/* death */

if(
player.hp <= 0
){

player.hp = 0;

gameOver = true;

}


/* victory */

if(
enemies.length === 0
){

gameOver = true;

}


updateHUD();

}


/* =========================
   DRAW
========================= */

function draw(){

ctx.clearRect(
0,
0,
W,
H
);


/* background */

ctx.fillStyle =
"#365b33";

ctx.fillRect(
0,
0,
W,
H
);


/* grid */

ctx.strokeStyle =
"#ffffff0c";


for(
let x=0;
x<W;
x+=50
){

ctx.beginPath();

ctx.moveTo(
x,
45
);

ctx.lineTo(
x,
H
);

ctx.stroke();

}


for(
let y=50;
y<H;
y+=50
){

ctx.beginPath();

ctx.moveTo(
0,
y
);

ctx.lineTo(
W,
y
);

ctx.stroke();

}


/* safe zone */

ctx.strokeStyle =
"#63cfff";

ctx.lineWidth = 4;

ctx.beginPath();

ctx.arc(

W/2,

(H+45)/2,

Math.min(W,H)*0.40,

0,

Math.PI*2

);

ctx.stroke();


/* buildings */

for(
const b of buildings
){

ctx.fillStyle =
"#6c6250";

ctx.fillRect(

b.x,
b.y,
b.w,
b.h

);


ctx.strokeStyle =
"#29271f";

ctx.lineWidth = 4;

ctx.strokeRect(

b.x,
b.y,
b.w,
b.h

);


/* door */

ctx.fillStyle =
"#b99b67";

ctx.fillRect(

b.x+b.w/2-15,

b.y+b.h-35,

30,

35

);


/* windows */

ctx.fillStyle =
"#8cc0d9";

ctx.fillRect(

b.x+25,
b.y+25,
35,
25

);

ctx.fillRect(

b.x+b.w-60,
b.y+25,
35,
25

);

}


/* loot */

for(
const box of lootBoxes
){

if(
box.taken
){

continue;

}


ctx.fillStyle =
"#d7a52e";

ctx.fillRect(

box.x-12,
box.y-10,
24,
20

);


ctx.fillStyle =
"#ffe57b";

ctx.fillRect(

box.x-8,
box.y-3,
16,
6

);

}


/* enemies */

for(
const enemy of enemies
){

ctx.fillStyle =
"#c94343";

ctx.beginPath();

ctx.arc(

enemy.x,
enemy.y,
enemy.r,
0,
Math.PI*2

);

ctx.fill();


/* enemy health */

ctx.fillStyle =
"#222";

ctx.fillRect(

enemy.x-18,
enemy.y-26,
36,
5

);


ctx.fillStyle =
"#62d46b";

ctx.fillRect(

enemy.x-18,
enemy.y-26,

36 *
enemy.hp /
60,

5

);

}


/* bullets */

for(
const bullet of bullets
){

ctx.fillStyle =
"#ffe05a";

ctx.beginPath();

ctx.arc(

bullet.x,
bullet.y,
4,
0,
Math.PI*2

);

ctx.fill();

}


/* enemy bullets */

for(
const bullet of enemyBullets
){

ctx.fillStyle =
"#ff754d";

ctx.beginPath();

ctx.arc(

bullet.x,
bullet.y,
bullet.r,
0,
Math.PI*2

);

ctx.fill();

}


/* player */

const angle =
Math.atan2(

mouse.y -
player.y,

mouse.x -
player.x

);


ctx.save();

ctx.translate(
player.x,
player.y
);

ctx.rotate(angle);


/* body */

ctx.fillStyle =
"#3da7ff";

ctx.beginPath();

ctx.arc(

0,
0,
player.r,
0,
Math.PI*2

);

ctx.fill();


/* gun */

ctx.fillStyle =
"#202020";

ctx.fillRect(

7,
-4,
30,
8

);


/* muzzle */

ctx.fillStyle =
"#ffd34d";

ctx.fillRect(

34,
-2,
7,
4

);


ctx.restore();


/* game over */

if(
gameOver
){

ctx.fillStyle =
"#000b";

ctx.fillRect(
0,
0,
W,
H
);


ctx.fillStyle =
"#fff";

ctx.textAlign =
"center";


ctx.font =
"bold 44px Arial";


ctx.fillText(

enemies.length === 0

? "VICTORY"

: "YOU DIED",

W/2,

H/2-20

);


ctx.font =
"20px Arial";


ctx.fillText(

"Press ENTER to restart",

W/2,

H/2+25

);

}

}


/* =========================
   GAME LOOP
========================= */

function gameLoop(){

update();

draw();

requestAnimationFrame(
gameLoop
);

}


gameLoop();


/* =========================
   FIRE BUTTON
========================= */

const fireButton =
document.getElementById(
"fire"
);


fireButton.addEventListener(
"pointerdown",
function(e){

e.preventDefault();

mouse.down = true;

shoot();

});


fireButton.addEventListener(
"pointerup",
function(e){

e.preventDefault();

mouse.down = false;

});


/* =========================
   RELOAD BUTTON
========================= */

document
.getElementById("reload")
.addEventListener(
"pointerdown",
function(){

ammo = 30;

updateHUD();

}
);


/* =========================
   JOYSTICK
========================= */

const joystick =
document.getElementById(
"joy"
);

const knob =
document.getElementById(
"knob"
);

let joystickPointer =
null;


joystick.addEventListener(
"pointerdown",
function(e){

joystickPointer =
e.pointerId;

joystick.setPointerCapture(
e.pointerId
);

moveJoystick(e);

});


joystick.addEventListener(
"pointermove",
function(e){

if(
e.pointerId ===
joystickPointer
){

moveJoystick(e);

}

});


joystick.addEventListener(
"pointerup",
function(){

joystickPointer =
null;

joystickX = 0;

joystickY = 0;

knob.style.left =
"40px";

knob.style.top =
"40px";

}
);


function moveJoystick(e){

const rect =
joystick.getBoundingClientRect();


let x =

e.clientX -

(
rect.left +
rect.width/2
);


let y =

e.clientY -

(
rect.top +
rect.height/2
);


const max = 40;

const distance =
Math.hypot(
x,
y
);


if(
distance > max
){

x =
x/distance*max;

y =
y/distance*max;

}


joystickX =
x/max;

joystickY =
y/max;


knob.style.left =
(40+x)+"px";

knob.style.top =
(40+y)+"px";

}


/* =========================
   MOBILE AIM
========================= */

window.addEventListener(
"pointermove",
function(e){

if(

e.pointerType ===
"touch"

&&

e.clientX >
W/2

){

mouse.x =
e.clientX;

mouse.y =
e.clientY;

}

});


</script>

</body>
</html>
