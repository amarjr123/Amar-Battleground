<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Amar Battleground v0.5</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
    touch-action:none;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
}

#hud{
    position:fixed;
    top:10px;
    left:10px;
    color:white;
    font-weight:bold;
    z-index:20;
    text-shadow:2px 2px 3px black;
}

#healthBox{
    position:fixed;
    top:38px;
    left:10px;
    width:200px;
    height:15px;
    background:#222;
    border:2px solid white;
    z-index:20;
}

#health{
    width:100%;
    height:100%;
    background:#35d04f;
}

#help{
    position:fixed;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    background:#000a;
    color:white;
    padding:8px 12px;
    border-radius:8px;
    z-index:20;
}

#startScreen{
    position:fixed;
    inset:0;
    background:#000c;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50;
}

#startBox{
    background:#182019;
    color:white;
    padding:35px;
    border-radius:16px;
    text-align:center;
}

#startButton{
    padding:14px 28px;
    border:none;
    border-radius:10px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

#joystick{
    position:fixed;
    left:20px;
    bottom:25px;
    width:130px;
    height:130px;
    border:3px solid #ffffff77;
    border-radius:50%;
    background:#ffffff16;
    display:none;
    z-index:30;
}

#stick{
    position:absolute;
    width:52px;
    height:52px;
    left:36px;
    top:36px;
    border-radius:50%;
    background:#ffffff99;
}

#fireButton{
    position:fixed;
    right:25px;
    bottom:35px;
    width:90px;
    height:90px;
    border-radius:50%;
    border:3px solid white;
    background:#cc3333cc;
    color:white;
    font-weight:bold;
    font-size:18px;
    display:none;
    z-index:30;
}

#reloadButton{
    position:fixed;
    right:135px;
    bottom:50px;
    padding:12px;
    background:#111c;
    color:white;
    border:2px solid white;
    border-radius:10px;
    display:none;
    z-index:30;
}

@media(max-width:700px){

    #joystick,
    #fireButton,
    #reloadButton{
        display:block;
    }

    #help{
        display:none;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
HP:
<span id="hp">100</span>

&nbsp; | &nbsp;

Enemies:
<span id="enemyCount">8</span>

&nbsp; | &nbsp;

Ammo:
<span id="ammo">30</span>

&nbsp; | &nbsp;

Loot:
<span id="lootCount">0</span>
</div>

<div id="healthBox">
    <div id="health"></div>
</div>

<div id="help">
WASD = Move | Mouse = Aim | Left Click = Shoot | R = Reload | E = Loot
</div>

<div id="joystick">
    <div id="stick"></div>
</div>

<button id="fireButton">
FIRE
</button>

<button id="reloadButton">
RELOAD
</button>

<div id="startScreen">

    <div id="startBox">

        <h1>
        AMAR BATTLEGROUND
        </h1>

        <p>
        Version 0.5
        </p>

        <button id="startButton">
        START GAME
        </button>

    </div>

</div>

<script>

/* ===============================
CANVAS
================================ */

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

let screenW =
window.innerWidth;

let screenH =
window.innerHeight;

canvas.width =
screenW;

canvas.height =
screenH;


/* ===============================
WORLD
================================ */

const WORLD_W = 3000;

const WORLD_H = 2000;


/* ===============================
PLAYER
================================ */

let player = {

    x:1500,

    y:1000,

    radius:18,

    hp:100,

    speed:4

};


/* ===============================
GAME DATA
================================ */

let enemies = [];

let playerBullets = [];

let enemyBullets = [];

let houses = [];

let trees = [];

let lootItems = [];

let keys = {};

let ammo = 30;

let lootCollected = 0;

let running = false;

let gameOver = false;

let lastShot = 0;


/* ===============================
CAMERA
================================ */

let camera = {

    x:0,

    y:0

};


/* ===============================
MOUSE
================================ */

let mouse = {

    x:screenW/2,

    y:screenH/2,

    down:false

};


/* ===============================
MOBILE
================================ */

let joystickX = 0;

let joystickY = 0;


/* ===============================
HUD
================================ */

const hpText =
document.getElementById("hp");

const enemyText =
document.getElementById("enemyCount");

const ammoText =
document.getElementById("ammo");

const lootText =
document.getElementById("lootCount");

const healthBar =
document.getElementById("health");


function updateHUD(){

    hpText.textContent =
    Math.ceil(
        Math.max(
            0,
            player.hp
        )
    );

    enemyText.textContent =
    enemies.length;

    ammoText.textContent =
    ammo;

    lootText.textContent =
    lootCollected;

    healthBar.style.width =
    Math.max(
        0,
        player.hp
    ) + "%";

}


/* ===============================
RESIZE
================================ */

window.addEventListener(
"resize",
function(){

    screenW =
    window.innerWidth;

    screenH =
    window.innerHeight;

    canvas.width =
    screenW;

    canvas.height =
    screenH;

});


/* ===============================
INPUT
================================ */

window.addEventListener(
"keydown",
function(event){

    const key =
    event.key.toLowerCase();

    keys[key] = true;


    if(
        key === "r"
    ){

        ammo = 30;

        updateHUD();

    }


    if(
        key === "e"
    ){

        collectLoot();

    }


    if(
        event.key === "Enter" &&
        gameOver
    ){

        resetGame();

    }

});


window.addEventListener(
"keyup",
function(event){

    keys[
        event.key.toLowerCase()
    ] = false;

});


canvas.addEventListener(
"mousemove",
function(event){

    mouse.x =
    event.clientX;

    mouse.y =
    event.clientY;

});


canvas.addEventListener(
"mousedown",
function(){

    mouse.down = true;

});


window.addEventListener(
"mouseup",
function(){

    mouse.down = false;

});


/* ===============================
COLLISION
================================ */

function circleCollision(
    a,
    b
){

    const ar =
    a.radius || 4;

    const br =
    b.radius || 4;


    return (

        Math.hypot(

            a.x-b.x,

            a.y-b.y

        )

        <

        ar+br

    );

}


/* ===============================
HOUSE COLLISION
================================ */

function circleHitsHouse(
    x,
    y,
    radius
){

    for(
        const house of houses
    ){

        const nearestX =
        Math.max(

            house.x,

            Math.min(
                x,
                house.x+house.w
            )

        );


        const nearestY =
        Math.max(

            house.y,

            Math.min(
                y,
                house.y+house.h
            )

        );


        const distance =
        Math.hypot(

            x-nearestX,

            y-nearestY

        );


        if(
            distance < radius
        ){

            return true;

        }

    }


    return false;

}


/* ===============================
WORLD CREATION
================================ */

function createWorld(){

    houses = [

        {
            x:300,
            y:250,
            w:280,
            h:200
        },

        {
            x:850,
            y:280,
            w:300,
            h:200
        },

        {
            x:1800,
            y:260,
            w:320,
            h:200
        },

        {
            x:2300,
            y:600,
            w:300,
            h:200
        },

        {
            x:400,
            y:1300,
            w:300,
            h:200
        },

        {
            x:1050,
            y:1450,
            w:320,
            h:210
        },

        {
            x:1900,
            y:1300,
            w:320,
            h:200
        }

    ];


    trees = [];


    for(
        let i=0;
        i<100;
        i++
    ){

        trees.push({

            x:
            60+
            Math.random()*
            (WORLD_W-120),

            y:
            60+
            Math.random()*
            (WORLD_H-120),

            radius:
            15+
            Math.random()*10

        });

    }


    lootItems = [];


    for(
        let i=0;
        i<20;
        i++
    ){

        lootItems.push({

            x:
            100+
            Math.random()*
            (WORLD_W-200),

            y:
            100+
            Math.random()*
            (WORLD_H-200),

            taken:false

        });

    }

}


/* ===============================
ENEMIES
================================ */

function createEnemies(){

    enemies = [];


    for(
        let i=0;
        i<8;
        i++
    ){

        let enemy;


        do{

            enemy = {

                x:
                100+
                Math.random()*
                (WORLD_W-200),

                y:
                100+
                Math.random()*
                (WORLD_H-200),

                radius:18,

                hp:100,

                speed:1.25,

                fireCooldown:
                50+
                Math.random()*100

            };

        }
        while(

            Math.hypot(

                enemy.x-
                player.x,

                enemy.y-
                player.y

            )

            < 500

        );


        enemies.push(
            enemy
        );

    }

}


/* ===============================
RESET GAME
================================ */

function resetGame(){

    player = {

        x:1500,

        y:1000,

        radius:18,

        hp:100,

        speed:4

    };


    ammo = 30;

    lootCollected = 0;

    gameOver = false;

    playerBullets = [];

    enemyBullets = [];


    createWorld();

    createEnemies();

    updateCamera();

    updateHUD();

}


/* ===============================
CAMERA
================================ */

function updateCamera(){

    camera.x =
    player.x-
    screenW/2;


    camera.y =
    player.y-
    screenH/2;


    camera.x =
    Math.max(

        0,

        Math.min(

            camera.x,

            WORLD_W-
            screenW

        )

    );


    camera.y =
    Math.max(

        0,

        Math.min(

            camera.y,

            WORLD_H-
            screenH

        )

    );

}


/* ===============================
PLAYER MOVEMENT
================================ */

function movePlayer(){

    let moveX = 0;

    let moveY = 0;


    if(
        keys["w"]
    ){

        moveY -= 1;

    }


    if(
        keys["s"]
    ){

        moveY += 1;

    }


    if(
        keys["a"]
    ){

        moveX -= 1;

    }


    if(
        keys["d"]
    ){

        moveX += 1;

    }


    moveX +=
    joystickX;

    moveY +=
    joystickY;


    const length =
    Math.hypot(
        moveX,
        moveY
    );


    if(
        length > 1
    ){

        moveX /= length;

        moveY /= length;

    }


    const newX =

    player.x +

    moveX*
    player.speed;


    const newY =

    player.y +

    moveY*
    player.speed;


    if(

        newX >
        player.radius

        &&

        newX <
        WORLD_W-
        player.radius

        &&

        !circleHitsHouse(

            newX,

            player.y,

            player.radius

        )

    ){

        player.x =
        newX;

    }


    if(

        newY >
        player.radius

        &&

        newY <
        WORLD_H-
        player.radius

        &&

        !circleHitsHouse(

            player.x,

            newY,

            player.radius

        )

    ){

        player.y =
        newY;

    }

}


/* ===============================
SHOOT
================================ */

function shoot(){

    if(

        !running ||

        gameOver ||

        ammo <= 0

    ){

        return;

    }


    const now =
    performance.now();


    if(
        now-lastShot < 150
    ){

        return;

    }


    lastShot =
    now;


    ammo--;


    const targetX =

    mouse.x +
    camera.x;


    const targetY =

    mouse.y +
    camera.y;


    const angle =

    Math.atan2(

        targetY-
        player.y,

        targetX-
        player.x

    );


    playerBullets.push({

        x:
        player.x+
        Math.cos(angle)*30,

        y:
        player.y+
        Math.sin(angle)*30,

        vx:
        Math.cos(angle)*12,

        vy:
        Math.sin(angle)*12,

        radius:5,

        life:100

    });


    updateHUD();

}


/* ===============================
ENEMY SHOOT
================================ */

function enemyShoot(
    enemy
){

    const angle =

    Math.atan2(

        player.y-
        enemy.y,

        player.x-
        enemy.x

    );


    enemyBullets.push({

        x:enemy.x,

        y:enemy.y,

        vx:
        Math.cos(angle)*5,

        vy:
        Math.sin(angle)*5,

        radius:5,

        life:180

    });

}


/* ===============================
LOOT
================================ */

function collectLoot(){

    for(
        const item of lootItems
    ){

        if(

            !item.taken

            &&

            Math.hypot(

                item.x-
                player.x,

                item.y-
                player.y

            )

            < 55

        ){

            item.taken =
            true;

            lootCollected++;

            ammo =
            Math.min(
                60,
                ammo+15
            );

            player.hp =
            Math.min(
                100,
                player.hp+10
            );

        }

    }


    updateHUD();

}


/* ===============================
UPDATE PLAYER BULLETS
================================ */

function updatePlayerBullets(){

    for(
        const bullet of
        playerBullets
    ){

        bullet.x +=
        bullet.vx;

        bullet.y +=
        bullet.vy;

        bullet.life--;


        for(
            const enemy of
            enemies
        ){

            if(
                enemy.hp <= 0
            ){

                continue;

            }


            if(
                circleCollision(
                    bullet,
                    enemy
                )
            ){

                enemy.hp -= 50;

                bullet.life = 0;

                break;

            }

        }

    }


    playerBullets =
    playerBullets.filter(
        function(bullet){

            return (
                bullet.life > 0
            );

        }
    );


    enemies =
    enemies.filter(
        function(enemy){

            return (
                enemy.hp > 0
            );

        }
    );

}


/* ===============================
UPDATE ENEMIES
================================ */

function updateEnemies(){

    for(
        const enemy of
        enemies
    ){

        const distance =

        Math.hypot(

            player.x-
            enemy.x,

            player.y-
            enemy.y

        );


        const angle =

        Math.atan2(

            player.y-
            enemy.y,

            player.x-
            enemy.x

        );


        if(
            distance > 160
        ){

            const newX =

            enemy.x +

            Math.cos(angle)*
            enemy.speed;


            const newY =

            enemy.y +

            Math.sin(angle)*
            enemy.speed;


            if(
                !circleHitsHouse(

                    newX,

                    enemy.y,

                    enemy.radius

                )
            ){

                enemy.x =
                newX;

            }


            if(
                !circleHitsHouse(

                    enemy.x,

                    newY,

                    enemy.radius

                )
            ){

                enemy.y =
                newY;

            }

        }


        enemy.fireCooldown--;


        if(

            distance < 600

            &&

            enemy.fireCooldown <= 0

        ){

            enemyShoot(
                enemy
            );


            enemy.fireCooldown =

            90+

            Math.random()*70;

        }

    }

}


/* ===============================
UPDATE ENEMY BULLETS
================================ */

function updateEnemyBullets(){

    for(
        const bullet of
        enemyBullets
    ){

        bullet.x +=
        bullet.vx;

        bullet.y +=
        bullet.vy;

        bullet.life--;


        if(
            circleCollision(

                bullet,

                player

            )
        ){

            player.hp -= 8;

            bullet.life = 0;

        }

    }


    enemyBullets =
    enemyBullets.filter(
        function(bullet){

            return (
                bullet.life > 0
            );

        }
    );

}


/* ===============================
UPDATE
================================ */

function update(){

    if(
        !running ||
        gameOver
    ){

        return;

    }


    movePlayer();

    updateCamera();

    updateEnemies();

    updatePlayerBullets();

    updateEnemyBullets();


    if(
        mouse.down
    ){

        shoot();

    }


    if(
        player.hp <= 0
    ){

        player.hp = 0;

        gameOver = true;

    }


    if(
        enemies.length === 0
    ){

        gameOver = true;

    }


    updateHUD();

}


/* ===============================
DRAW GROUND
================================ */

function drawGround(){

    ctx.fillStyle =
    "#37623a";


    ctx.fillRect(

        0,
        0,

        WORLD_W,

        WORLD_H

    );


    ctx.strokeStyle =
    "#ffffff0c";


    for(
        let x=0;
        x<WORLD_W;
        x+=80
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            WORLD_H
        );

        ctx.stroke();

    }


    for(
        let y=0;
        y<WORLD_H;
        y+=80
    ){

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            WORLD_W,
            y
        );

        ctx.stroke();

    }

}


/* ===============================
DRAW HOUSES
================================ */

function drawHouses(){

    for(
        const house of
        houses
    ){

        ctx.fillStyle =
        "#706758";


        ctx.fillRect(

            house.x,

            house.y,

            house.w,

            house.h

        );


        ctx.strokeStyle =
        "#25231f";

        ctx.lineWidth = 7;


        ctx.strokeRect(

            house.x,

            house.y,

            house.w,

            house.h

        );


        ctx.fillStyle =
        "#71a8c7";


        ctx.fillRect(

            house.x+30,

            house.y+35,

            50,

            35

        );


        ctx.fillRect(

            house.x+
            house.w-80,

            house.y+35,

            50,

            35

        );


        ctx.fillStyle =
        "#9a713f";


        ctx.fillRect(

            house.x+
            house.w/2-20,

            house.y+
            house.h-60,

            40,

            60

        );

    }

}


/* ===============================
DRAW TREES
================================ */

function drawTrees(){

    for(
        const tree of trees
    ){

        ctx.fillStyle =
        "#51301b";


        ctx.fillRect(

            tree.x-5,

            tree.y,

            10,

            28

        );


        ctx.fillStyle =
        "#176f35";


        ctx.beginPath();

        ctx.arc(

            tree.x,

            tree.y,

            tree.radius,

            0,

            Math.PI*2

        );

        ctx.fill();


        ctx.fillStyle =
        "#26934b";


        ctx.beginPath();

        ctx.arc(

            tree.x-7,

            tree.y-8,

            tree.radius*.65,

            0,

            Math.PI*2

        );

        ctx.fill();

    }

}


/* ===============================
DRAW LOOT
================================ */

function drawLoot(){

    for(
        const item of
        lootItems
    ){

        if(
            item.taken
        ){

            continue;

        }


        ctx.fillStyle =
        "#e2a92e";


        ctx.fillRect(

            item.x-14,

            item.y-12,

            28,

            24

        );


        ctx.fillStyle =
        "#fff09b";


        ctx.fillRect(

            item.x-8,

            item.y-3,

            16,

            6

        );

    }

}


/* ===============================
DRAW SOLDIER
================================ */

function drawSoldier(
    object,
    enemy
){

    let angle;


    if(
        enemy
    ){

        angle =
        Math.atan2(

            player.y-
            object.y,

            player.x-
            object.x

        );

    }
    else{

        const mx =

        mouse.x+
        camera.x;


        const my =

        mouse.y+
        camera.y;


        angle =
        Math.atan2(

            my-object.y,

            mx-object.x

        );

    }


    ctx.save();


    ctx.translate(

        object.x,

        object.y

    );


    ctx.rotate(
        angle
    );


    /* shadow */

    ctx.fillStyle =
    "#0005";


    ctx.beginPath();

    ctx.ellipse(

        0,

        17,

        18,

        7,

        0,

        0,

        Math.PI*2

    );

    ctx.fill();


    /* legs */

    ctx.strokeStyle =
    "#202020";

    ctx.lineWidth = 6;


    ctx.beginPath();

    ctx.moveTo(
        -7,
        8
    );

    ctx.lineTo(
        -8,
        22
    );

    ctx.moveTo(
        7,
        8
    );

    ctx.lineTo(
        8,
        22
    );

    ctx.stroke();


    /* body */

    ctx.fillStyle =

    enemy

    ?

    "#a43e3e"

    :

    "#307eb8";


    ctx.fillRect(

        -12,

        -10,

        24,

        27

    );


    /* armour */

    ctx.fillStyle =

    enemy

    ?

    "#632727"

    :

    "#234d70";


    ctx.fillRect(

        -10,

        -4,

        20,

        13

    );


    /* head */

    ctx.fillStyle =
    "#d7a578";


    ctx.beginPath();

    ctx.arc(

        0,

        -16,

        9,

        0,

        Math.PI*2

    );

    ctx.fill();


    /* helmet */

    ctx.fillStyle =

    enemy

    ?

    "#532323"

    :

    "#263947";


    ctx.beginPath();

    ctx.arc(

        0,

        -19,

        10,

        Math.PI,

        Math.PI*2

    );

    ctx.fill();


    /* gun */

    ctx.fillStyle =
    "#17191b";


    ctx.fillRect(

        8,

        -3,

        36,

        7

    );


    ctx.fillRect(

        19,

        4,

        7,

        8

    );


    ctx.restore();


    if(
        enemy
    ){

        ctx.fillStyle =
        "#222";


        ctx.fillRect(

            object.x-22,

            object.y-38,

            44,

            6

        );


        ctx.fillStyle =
        "#42d15b";


        ctx.fillRect(

            object.x-22,

            object.y-38,

            44*
            object.hp/
            100,

            6

        );

    }

}


/* ===============================
DRAW BULLETS
================================ */

function drawBullets(){

    for(
        const bullet of
        playerBullets
    ){

        ctx.fillStyle =
        "#ffe44c";


        ctx.beginPath();

        ctx.arc(

            bullet.x,

            bullet.y,

            bullet.radius,

            0,

            Math.PI*2

        );

        ctx.fill();

    }


    for(
        const bullet of
        enemyBullets
    ){

        ctx.fillStyle =
        "#ff553f";


        ctx.beginPath();

        ctx.arc(

            bullet.x,

            bullet.y,

            bullet.radius,

            0,

            Math.PI*2

        );

        ctx.fill();

    }

}


/* ===============================
DRAW
================================ */

function draw(){

    ctx.clearRect(
        0,
        0,
        screenW,
        screenH
    );


    ctx.save();


    ctx.translate(

        -camera.x,

        -camera.y

    );


    drawGround();

    drawTrees();

    drawHouses();

    drawLoot();


    for(
        const enemy of
        enemies
    ){

        drawSoldier(
            enemy,
            true
        );

    }


    drawBullets();


    drawSoldier(
        player,
        false
    );


    ctx.restore();


    if(
        gameOver
    ){

        ctx.fillStyle =
        "#000c";


        ctx.fillRect(

            0,

            0,

            screenW,

            screenH

        );


        ctx.fillStyle =
        "white";


        ctx.textAlign =
        "center";


        ctx.font =
        "bold 48px Arial";


        ctx.fillText(

            enemies.length === 0

            ?

            "VICTORY"

            :

            "YOU DIED",

            screenW/2,

            screenH/2-20

        );


        ctx.font =
        "20px Arial";


        ctx.fillText(

            "Press ENTER to restart",

            screenW/2,

            screenH/2+30

        );

    }

}


/* ===============================
GAME LOOP
================================ */

function gameLoop(){

    update();

    draw();

    requestAnimationFrame(
        gameLoop
    );

}


gameLoop();

/* ===============================
JOYSTICK
================================ */

const joystick =
document.getElementById(
    "joystick"
);


const stick =
document.getElementById(
    "stick"
);


let joystickPointer =
null;


joystick.addEventListener(
"pointerdown",
function(event){

    joystickPointer =
    event.pointerId;


    joystick.setPointerCapture(
        event.pointerId
    );


    moveJoystick(
        event
    );

});


joystick.addEventListener(
"pointermove",
function(event){

    if(
        event.pointerId ===
        joystickPointer
    ){

        moveJoystick(
            event
        );

    }

});


joystick.addEventListener(
"pointerup",
function(){

    joystickPointer =
    null;

    joystickX = 0;

    joystickY = 0;

    stick.style.left =
    "36px";

    stick.style.top =
    "36px";

});


function moveJoystick(
    event
){

    const rect =
    joystick.getBoundingClientRect();


    let x =

    event.clientX -

    (
        rect.left+
        rect.width/2
    );


    let y =

    event.clientY -

    (
        rect.top+
        rect.height/2
    );


    const max = 38;


    const distance =
    Math.hypot(
        x,
        y
    );


    if(
        distance > max
    ){

        x =
        x/distance*max;

        y =
        y/distance*max;

    }


    joystickX =
    x/max;


    joystickY =
    y/max;


    stick.style.left =
    (36+x)+"px";


    stick.style.top =
    (36+y)+"px";

}
