<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Amar Battleground v0.2</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#111;font-family:Arial;touch-action:none
}
canvas{
 width:100vw;height:100vh;display:block;
 background:#274325
}
#hud{
 position:fixed;top:10px;left:12px;color:#fff;
 font-weight:bold;text-shadow:2px 2px 3px #000;
 z-index:3;font-size:17px
}
#help{
 position:fixed;bottom:8px;left:50%;
 transform:translateX(-50%);
 color:#fff;background:#0009;padding:6px 10px;
 border-radius:8px;font-size:13px;z-index:3
}
#start{
 position:fixed;inset:0;display:grid;
 place-items:center;background:#000b;
 z-index:10;color:#fff
}
.panel{
 background:#182018;padding:28px;
 border-radius:16px;text-align:center
}
.panel button{
 font-size:18px;padding:12px 25px;
 border:0;border-radius:10px
}
#joy{
 position:fixed;left:24px;bottom:35px;
 width:130px;height:130px;
 border:3px solid #ffffff66;
 border-radius:50%;
 background:#ffffff18;
 z-index:5;display:none
}
#knob{
 position:absolute;left:40px;top:40px;
 width:50px;height:50px;border-radius:50%;
 background:#ffffff77
}
#fire{
 position:fixed;right:30px;bottom:45px;
 width:90px;height:90px;border-radius:50%;
 border:3px solid #fff9;background:#d33b3baa;
 color:#fff;font-weight:bold;font-size:18px;
 z-index:5;display:none
}
#reload{
 position:fixed;right:140px;bottom:55px;
 border:2px solid #fff8;border-radius:12px;
 background:#0008;color:#fff;padding:12px;
 z-index:5;display:none
}
@media(max-width:700px){
 #joy,#fire,#reload{display:block}
 #help{display:none}
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
HP: <span id="hp">100</span> |
Enemies: <span id="enemies">8</span> |
Ammo: <span id="ammo">30</span>
</div>

<div id="help">
WASD / joystick = move · Mouse = aim · Click/FIRE = shoot · R = reload
</div>

<div id="joy">
<div id="knob"></div>
</div>

<button id="fire">FIRE</button>
<button id="reload">RELOAD</button>

<div id="start">
<div class="panel">
<h1>AMAR BATTLEGROUND</h1>
<p>Version 0.2 — Mobile Prototype</p>
<button id="startBtn">START GAME</button>
</div>
</div>

<script>

const c=document.getElementById("game");
const ctx=c.getContext("2d");

let W,H;

function resize(){
 W=c.width=innerWidth;
 H=c.height=innerHeight;
}

resize();
addEventListener("resize",resize);

let keys={};

let mouse={
 x:W/2,
 y:H/2,
 down:false
};

let running=false;
let over=false;

let player;
let enemies=[];
let bullets=[];
let enemyBullets=[];

let ammo=30;
let lastShot=0;

let joyX=0;
let joyY=0;

const hpEl=document.getElementById("hp");
const enemiesEl=document.getElementById("enemies");
const ammoEl=document.getElementById("ammo");


/* KEYBOARD */

addEventListener("keydown",e=>{

 keys[e.key.toLowerCase()]=true;

 if(e.key.toLowerCase()==="r")
   ammo=30;

 if(e.key==="Enter" && over)
   reset();

});

addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});


/* MOUSE */

c.addEventListener("mousemove",e=>{
 mouse.x=e.clientX;
 mouse.y=e.clientY;
});

c.addEventListener("mousedown",()=>{
 mouse.down=true;
});

addEventListener("mouseup",()=>{
 mouse.down=false;
});


/* RESET GAME */

function reset(){

 player={
   x:W/2,
   y:H/2,
   r:18,
   hp:100,
   speed:3.2
 };

 enemies=[];
 bullets=[];
 enemyBullets=[];

 ammo=30;
 over=false;

 for(let i=0;i<8;i++){

   let e;

   do{

     e={
       x:50+Math.random()*(W-100),
       y:80+Math.random()*(H-130),
       r:17,
       hp:60,
       speed:1.1
     };

   }while(
     Math.hypot(
       e.x-player.x,
       e.y-player.y
     )<180
   );

   enemies.push(e);
 }

 updateHUD();
}


/* HUD */

function updateHUD(){

 hpEl.textContent=Math.max(
   0,
   Math.ceil(player.hp)
 );

 enemiesEl.textContent=enemies.length;

 ammoEl.textContent=ammo;
}


/* SHOOT */

function shoot(){

 if(!running || over || ammo<=0)
   return;

 let now=performance.now();

 if(now-lastShot<170)
   return;

 lastShot=now;

 ammo--;

 let angle=Math.atan2(
   mouse.y-player.y,
   mouse.x-player.x
 );

 bullets.push({

   x:player.x,
   y:player.y,

   vx:Math.cos(angle)*10,
   vy:Math.sin(angle)*10

 });
}


/* COLLISION */

function hit(a,b){

 return Math.hypot(
   a.x-b.x,
   a.y-b.y
 ) < a.r+b.r;

}


/* UPDATE */

function update(){

 if(!running || over)
   return;


 /* MOVEMENT */

 let dx=
   (keys.d?1:0)-
   (keys.a?1:0)+joyX;

 let dy=
   (keys.s?1:0)-
   (keys.w?1:0)+joyY;

 let distance=Math.hypot(dx,dy);

 if(distance>1){

   dx/=distance;
   dy/=distance;

 }

 player.x+=dx*player.speed;
 player.y+=dy*player.speed;

 player.x=Math.max(
   22,
   Math.min(W-22,player.x)
 );

 player.y=Math.max(
   50,
   Math.min(H-22,player.y)
 );


 /* AUTO SHOOT */

 if(mouse.down)
   shoot();


 /* PLAYER BULLETS */

 bullets.forEach(b=>{

   b.x+=b.vx;
   b.y+=b.vy;

 });

 bullets=bullets.filter(b=>
   b.x>-30 &&
   b.x<W+30 &&
   b.y>-30 &&
   b.y<H+30
 );


 /* ENEMIES */

 for(const e of enemies){

   let angle=Math.atan2(
     player.y-e.y,
     player.x-e.x
   );

   let distance=Math.hypot(
     player.x-e.x,
     player.y-e.y
   );

   if(distance>90){

     e.x+=Math.cos(angle)*e.speed;
     e.y+=Math.sin(angle)*e.speed;

   }else{

     player.hp-=0.08;

   }

 }


 /* ENEMY SHOOT */

 if(Math.random()<0.025){

   enemies.forEach(e=>{

     let angle=Math.atan2(
       player.y-e.y,
       player.x-e.x
     );

     enemyBullets.push({

       x:e.x,
       y:e.y,

       vx:Math.cos(angle)*4,
       vy:Math.sin(angle)*4,

       r:4

     });

   });

 }


 /* ENEMY BULLETS */

 enemyBullets.forEach(b=>{

   b.x+=b.vx;
   b.y+=b.vy;

   if(hit(b,player)){

     player.hp-=7;

     b.x=-999;

   }

 });


 /* BULLET HIT */

 for(const b of bullets){

   for(const e of enemies){

     if(e.hp>0 && hit(b,e)){

       e.hp-=30;

       b.x=-999;

     }

   }

 }


 enemies=enemies.filter(e=>e.hp>0);


 /* GAME END */

 if(player.hp<=0){

   player.hp=0;
   over=true;

 }

 if(enemies.length===0){

   over=true;

 }

 updateHUD();

}


/* DRAW */

function draw(){

 ctx.clearRect(0,0,W,H);


 /* MAP */

 ctx.fillStyle="#31552f";

 ctx.fillRect(
   0,0,W,H
 );


 /* GRID */

 ctx.strokeStyle="#ffffff10";

 for(let x=0;x<W;x+=50){

   ctx.beginPath();
   ctx.moveTo(x,45);
   ctx.lineTo(x,H);
   ctx.stroke();

 }

 for(let y=50;y<H;y+=50){

   ctx.beginPath();
   ctx.moveTo(0,y);
   ctx.lineTo(W,y);
   ctx.stroke();

 }


 /* SAFE ZONE */

 ctx.strokeStyle="#62cfff";
 ctx.lineWidth=4;

 ctx.beginPath();

 ctx.arc(
   W/2,
   (H+45)/2,
   Math.min(W,H)*.38,
   0,
   Math.PI*2
 );

 ctx.stroke();


 /* ENEMIES */

 for(const e of enemies){

   ctx.fillStyle="#d44";

   ctx.beginPath();

   ctx.arc(
     e.x,
     e.y,
     e.r,
     0,
     Math.PI*2
   );

   ctx.fill();


   /* HP BAR */

   ctx.fillStyle="#222";

   ctx.fillRect(
     e.x-18,
     e.y-27,
     36,
     5
   );

   ctx.fillStyle="#5d5";

   ctx.fillRect(
     e.x-18,
     e.y-27,
     36*e.hp/60,
     5
   );

 }


 /* PLAYER BULLETS */

 for(const b of bullets){

   ctx.fillStyle="#ffd34d";

   ctx.beginPath();

   ctx.arc(
     b.x,
     b.y,
     4,
     0,
     Math.PI*2
   );

   ctx.fill();

 }


 /* ENEMY BULLETS */

 for(const b of enemyBullets){

   ctx.fillStyle="#ff754d";

   ctx.beginPath();

   ctx.arc(
     b.x,
     b.y,
     b.r,
     0,
     Math.PI*2
   );

   ctx.fill();

 }


 /* PLAYER */

 let angle=Math.atan2(
   mouse.y-player.y,
   mouse.x-player.x
 );

 ctx.save();

 ctx.translate(
   player.x,
   player.y
 );

 ctx.rotate(angle);

 ctx.fillStyle="#3da7ff";

 ctx.beginPath();

 ctx.arc(
   0,
   0,
   18,
   0,
   Math.PI*2
 );

 ctx.fill();


 /* GUN */

 ctx.fillStyle="#222";

 ctx.fillRect(
   8,
   -4,
   28,
   8
 );

 ctx.restore();


 /* GAME OVER */

 if(over){

   ctx.fillStyle="#000b";

   ctx.fillRect(
     0,
     0,
     W,
     H
   );

   ctx.fillStyle="#fff";

   ctx.textAlign="center";

   ctx.font="bold 44px Arial";

   ctx.fillText(
     enemies.length===0
       ?"VICTORY"
       :"YOU DIED",
     W/2,
     H/2-20
   );

   ctx.font="20px Arial";

   ctx.fillText(
     "Press ENTER to restart",
     W/2,
     H/2+25
   );

 }

}


/* GAME LOOP */

function loop(){

 update();
 draw();

 requestAnimationFrame(loop);

}

loop();


/* START */

document.getElementById("startBtn").onclick=()=>{

 document.getElementById(
   "start"
 ).style.display="none";

 running=true;

 reset();

};


/* FIRE BUTTON */

document.getElementById("fire")
.onpointerdown=e=>{

 e.preventDefault();

 mouse.down=true;

 shoot();

};

document.getElementById("fire")
.onpointerup=e=>{

 mouse.down=false;

};


/* RELOAD */

document.getElementById("reload")
.onpointerdown=()=>{

 ammo=30;

};


/* JOYSTICK */

const joy=document.getElementById("joy");
const knob=document.getElementById("knob");

let joyId=null;

joy.addEventListener(
 "pointerdown",
 e=>{

   joyId=e.pointerId;

   joy.setPointerCapture(
     e.pointerId
   );

   moveJoy(e);

 }
);

joy.addEventListener(
 "pointermove",
 e=>{

   if(e.pointerId===joyId)
     moveJoy(e);

 }
);

joy.addEventListener(
 "pointerup",
 ()=>{

   joyId=null;

   joyX=0;
   joyY=0;

   knob.style.left="40px";
   knob.style.top="40px";

 }
);


function moveJoy(e){

 let r=joy.getBoundingClientRect();

 let x=
   e.clientX-
   (r.left+r.width/2);

 let y=
   e.clientY-
   (r.top+r.height/2);

 let distance=Math.hypot(x,y);

 let max=40;

 if(distance>max){

   x=x/distance*max;
   y=y/distance*max;

 }

 joyX=x/max;
 joyY=y/max;

 knob.style.left=
   (40+x)+"px";

 knob.style.top=
   (40+y)+"px";

}


/* MOBILE AIM */

addEventListener(
 "pointermove",
 e=>{

   if(
     e.pointerType==="touch" &&
     e.clientX>W/2
   ){

     mouse.x=e.clientX;
     mouse.y=e.clientY;

   }

 }
);

</script>

</body>
</html>
