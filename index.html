<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Amar Battleground 3D</title>

<style>
*{box-sizing:border-box}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
    touch-action:none;
}
canvas{display:block}

#hud{
    position:fixed;
    left:15px;
    top:15px;
    z-index:10;
    color:#fff;
    text-shadow:0 2px 4px #000;
    font-weight:bold;
}

#bar{
    width:220px;
    height:20px;
    border:2px solid #fff;
    background:#222;
    margin-top:5px;
}

#hp{
    width:100%;
    height:100%;
    background:#18d45a;
}

#ammo{
    font-size:22px;
    margin-top:8px;
}

#enemies{
    margin-top:5px;
}

#cross{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:28px;
    z-index:20;
    pointer-events:none;
}

#start,#over{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.82);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

#over{display:none}

.box{
    width:min(90%,450px);
    padding:30px;
    background:#171717;
    border-radius:18px;
}

h1{
    margin:0 0 15px;
    font-size:38px;
}

button{
    border:0;
    border-radius:10px;
    padding:14px 35px;
    font-size:19px;
    font-weight:bold;
    color:#fff;
    background:#d92727;
}

#mobile{
    display:none;
    position:fixed;
    inset:0;
    z-index:50;
    pointer-events:none;
}

#joy{
    position:absolute;
    left:25px;
    bottom:30px;
    width:135px;
    height:135px;
    border:2px solid #ffffff66;
    background:#ffffff18;
    border-radius:50%;
    pointer-events:auto;
}

#stick{
    position:absolute;
    width:55px;
    height:55px;
    left:38px;
    top:38px;
    border-radius:50%;
    background:#ffffff77;
}

.mob{
    position:absolute;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    color:white;
    border:2px solid #ffffff66;
    background:#0008;
    pointer-events:auto;
    font-weight:bold;
}

#fire{
    width:90px;
    height:90px;
    right:25px;
    bottom:40px;
    background:#b40000aa;
}

#reload{
    width:65px;
    height:65px;
    right:125px;
    bottom:125px;
}

#loading{
    position:fixed;
    inset:0;
    z-index:200;
    background:#111;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
}

@media(max-width:800px){
    #mobile{display:block}
    #hud{transform:scale(.85);transform-origin:top left}
}
</style>
</head>

<body>

<div id="loading">3D CHARACTER LOADING...</div>

<div id="hud">
    <div>❤️ HEALTH</div>
    <div id="bar"><div id="hp"></div></div>
    <div id="ammo">🔫 30 / 120</div>
    <div id="enemies">👾 ENEMIES: 8</div>
</div>

<div id="cross">+</div>

<div id="start">
    <div class="box">
        <h1>AMAR BATTLEGROUND</h1>
        <p>
            REAL 3D CHARACTER EDITION<br><br>
            WASD — Move<br>
            Mouse — Camera<br>
            Left Click — Shoot<br>
            R — Reload
        </p>
        <button id="startBtn">START</button>
    </div>
</div>

<div id="over">
    <div class="box">
        <h1>GAME OVER</h1>
        <button onclick="location.reload()">PLAY AGAIN</button>
    </div>
</div>

<div id="mobile">
    <div id="joy">
        <div id="stick"></div>
    </div>

    <div id="reload" class="mob">R</div>
    <div id="fire" class="mob">FIRE</div>
</div>

<script type="importmap">
{
    "imports":{
        "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">

import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";


/* =========================
   VARIABLES
========================= */

let scene;
let camera;
let renderer;
let clock;

let player;
let mixer;

let idleAction;
let walkAction;
let runAction;
let currentAction;

let enemies=[];
let bullets=[];
let enemyBullets=[];

let buildings=[];

let running=false;
let dead=false;

let health=100;

let ammo=30;
let reserve=120;

let shooting=false;
let lastShot=0;

let yaw=0;
let pitch=.25;

let keys={};

let joyX=0;
let joyY=0;

const speed=.11;


/* =========================
   INIT
========================= */

async function init(){

    scene=new THREE.Scene();

    scene.background=new THREE.Color(0x83b6df);

    scene.fog=new THREE.Fog(
        0x83b6df,
        60,
        220
    );


    camera=new THREE.PerspectiveCamera(
        70,
        innerWidth/innerHeight,
        .1,
        500
    );


    renderer=new THREE.WebGLRenderer({
        antialias:true
    });

    renderer.setSize(
        innerWidth,
        innerHeight
    );

    renderer.setPixelRatio(
        Math.min(devicePixelRatio,2)
    );

    renderer.shadowMap.enabled=true;

    renderer.outputColorSpace=
        THREE.SRGBColorSpace;

    document.body.appendChild(
        renderer.domElement
    );


    clock=new THREE.Clock();


    /* LIGHT */

    const hemi=
        new THREE.HemisphereLight(
            0xffffff,
            0x35552c,
            2.2
        );

    scene.add(hemi);


    const sun=
        new THREE.DirectionalLight(
            0xffffff,
            3
        );

    sun.position.set(
        50,
        100,
        30
    );

    sun.castShadow=true;

    scene.add(sun);


    createWorld();

    await loadCharacter();

    createEnemies(8);

    setupControls();

    document.getElementById(
        "loading"
    ).style.display="none";

    animate();
}


/* =========================
   WORLD
========================= */

function createWorld(){

    const ground=
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                200,
                200
            ),

            new THREE.MeshStandardMaterial({
                color:0x4f873c
            })

        );

    ground.rotation.x=-Math.PI/2;

    ground.receiveShadow=true;

    scene.add(ground);


    /* ROAD */

    const roadMaterial=
        new THREE.MeshStandardMaterial({
            color:0x414141
        });


    const road1=
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                200,
                12
            ),
            roadMaterial
        );

    road1.rotation.x=-Math.PI/2;
    road1.position.y=.02;

    scene.add(road1);


    const road2=
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                12,
                200
            ),
            roadMaterial
        );

    road2.rotation.x=-Math.PI/2;
    road2.position.y=.03;

    scene.add(road2);


    /* BUILDINGS */

    const spots=[
        [-50,-45,18,14],
        [-25,-50,14,12],
        [35,-48,18,13],
        [55,-20,14,18],
        [-55,20,18,14],
        [-30,45,18,13],
        [35,35,20,15],
        [60,60,15,12],
        [-65,65,15,12]
    ];


    for(const p of spots){

        createBuilding(
            p[0],
            p[1],
            p[2],
            p[3]
        );

    }


    /* TREES */

    for(let i=0;i<70;i++){

        const x=
            (Math.random()-.5)*180;

        const z=
            (Math.random()-.5)*180;

        if(
            Math.abs(x)<12 ||
            Math.abs(z)<12
        ) continue;


        createTree(x,z);
    }
}


/* =========================
   BUILDING
========================= */

function createBuilding(
    x,
    z,
    w,
    d
){

    const h=5+Math.random()*4;


    const b=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                w,
                h,
                d
            ),

            new THREE.MeshStandardMaterial({
                color:0xb59d82
            })

        );


    b.position.set(
        x,
        h/2,
        z
    );

    b.castShadow=true;
    b.receiveShadow=true;

    scene.add(b);

    buildings.push(b);


    const roof=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                w+1,
                .6,
                d+1
            ),

            new THREE.MeshStandardMaterial({
                color:0x57382c
            })

        );


    roof.position.set(
        x,
        h+.3,
        z
    );

    scene.add(roof);
}


/* =========================
   TREE
========================= */

function createTree(x,z){

    const group=
        new THREE.Group();


    const trunk=
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .35,
                .5,
                4,
                8
            ),

            new THREE.MeshStandardMaterial({
                color:0x654321
            })

        );

    trunk.position.y=2;

    group.add(trunk);


    const leaves=
        new THREE.Mesh(

            new THREE.SphereGeometry(
                2.5,
                8,
                8
            ),

            new THREE.MeshStandardMaterial({
                color:0x1f6927
            })

        );

    leaves.position.y=5;

    group.add(leaves);


    group.position.set(
        x,
        0,
        z
    );

    scene.add(group);
}


/* =========================
   REAL 3D CHARACTER
========================= */

async function loadCharacter(){

    const loader=
        new GLTFLoader();


    const gltf=
        await loader.loadAsync(
            "https://threejs.org/examples/models/gltf/Soldier.glb"
        );


    player=
        gltf.scene;


    player.scale.setScalar(1.8);

    player.position.set(
        0,
        0,
        0
    );


    player.traverse(obj=>{

        if(obj.isMesh){

            obj.castShadow=true;
            obj.receiveShadow=true;

        }

    });


    scene.add(player);


    mixer=
        new THREE.AnimationMixer(
            player
        );


    const animations=
        gltf.animations;


    for(const clip of animations){

        if(clip.name==="Idle"){

            idleAction=
                mixer.clipAction(clip);

        }

        if(clip.name==="Walk"){

            walkAction=
                mixer.clipAction(clip);

        }

        if(clip.name==="Run"){

            runAction=
                mixer.clipAction(clip);

        }

    }


    if(idleAction){

        idleAction.play();

        currentAction=
            idleAction;

    }
}


/* =========================
   CHANGE ANIMATION
========================= */

function animation(action){

    if(!action || action===currentAction)
        return;


    currentAction.fadeOut(.15);

    action
        .reset()
        .fadeIn(.15)
        .play();

    currentAction=action;
}


/* =========================
   ENEMIES
========================= */

async function createEnemies(count){

    const loader=
        new GLTFLoader();


    const gltf=
        await loader.loadAsync(
            "https://threejs.org/examples/models/gltf/Soldier.glb"
        );


    for(let i=0;i<count;i++){

        const enemy=
            gltf.scene.clone(true);


        enemy.scale.setScalar(1.8);


        enemy.traverse(obj=>{

            if(obj.isMesh)
                obj.castShadow=true;

        });


        let x,z;

        do{

            x=(Math.random()-.5)*150;
            z=(Math.random()-.5)*150;

        }while(
            Math.sqrt(x*x+z*z)<25
        );


        enemy.position.set(
            x,
            0,
            z
        );


        scene.add(enemy);


        const enemyMixer=
            new THREE.AnimationMixer(enemy);


        let action=null;


        if(gltf.animations.length){

            const walk=
                gltf.animations.find(
                    a=>a.name==="Walk"
                );

            if(walk){

                action=
                    enemyMixer.clipAction(walk);

                action.play();

            }

        }


        enemies.push({

            mesh:enemy,

            mixer:enemyMixer,

            hp:100,

            cooldown:
                Math.random()*2000

        });

    }


    updateEnemyHUD();
}


/* =========================
   CONTROLS
========================= */

function setupControls(){

    window.addEventListener(
        "keydown",
        e=>{

            keys[
                e.key.toLowerCase()
            ]=true;


            if(
                e.key.toLowerCase()==="r"
            ){

                reload();

            }

        }
    );


    window.addEventListener(
        "keyup",
        e=>{

            keys[
                e.key.toLowerCase()
            ]=false;

        }
    );


    renderer.domElement.addEventListener(
        "mousemove",
        e=>{

            if(
                document.pointerLockElement===
                renderer.domElement
            ){

                yaw-=e.movementX*.0025;

                pitch-=e.movementY*.002;

                pitch=
                    Math.max(
                        -.4,
                        Math.min(
                            .7,
                            pitch
                        )
                    );

            }

        }
    );


    renderer.domElement.addEventListener(
        "mousedown",
        e=>{

            if(e.button===0){

                shooting=true;

                shoot();

            }

        }
    );


    window.addEventListener(
        "mouseup",
        e=>{

            if(e.button===0)
                shooting=false;

        }
    );


    document.getElementById(
        "startBtn"
    ).onclick=()=>{

        running=true;

        document.getElementById(
            "start"
        ).style.display="none";


        if(innerWidth>800){

            renderer.domElement.requestPointerLock();

        }

    };


    /* MOBILE */

    const joy=
        document.getElementById("joy");

    const stick=
        document.getElementById("stick");

    let touching=false;


    joy.addEventListener(
        "touchstart",
        e=>{

            touching=true;

            e.preventDefault();

        },
        {passive:false}
    );


    joy.addEventListener(
        "touchmove",
        e=>{

            if(!touching)
                return;


            const r=
                joy.getBoundingClientRect();

            const t=e.touches[0];


            let dx=
                t.clientX-
                (r.left+r.width/2);

            let dy=
                t.clientY-
                (r.top+r.height/2);


            const max=45;

            const len=
                Math.sqrt(
                    dx*dx+dy*dy
                );


            if(len>max){

                dx=dx/len*max;
                dy=dy/len*max;

            }


            joyX=dx/max;
            joyY=dy/max;


            stick.style.left=
                (38+dx)+"px";

            stick.style.top=
                (38+dy)+"px";


            e.preventDefault();

        },
        {passive:false}
    );


    joy.addEventListener(
        "touchend",
        ()=>{

            touching=false;

            joyX=0;
            joyY=0;

            stick.style.left="38px";
            stick.style.top="38px";

        }
    );


    const fire=
        document.getElementById("fire");


    fire.addEventListener(
        "touchstart",
        e=>{

            shooting=true;

            shoot();

            e.preventDefault();

        },
        {passive:false}
    );


    fire.addEventListener(
        "touchend",
        ()=>{

            shooting=false;

        }
    );


    document.getElementById(
        "reload"
    ).addEventListener(
        "touchstart",
        e=>{

            reload();

            e.preventDefault();

        },
        {passive:false}
    );
}


/* =========================
   PLAYER MOVEMENT
========================= */

function updatePlayer(){

    let forward=0;
    let right=0;


    if(keys.w) forward++;
    if(keys.s) forward--;

    if(keys.d) right++;
    if(keys.a) right--;


    forward+=-joyY;
    right+=joyX;


    const length=
        Math.sqrt(
            forward*forward+
            right*right
        );


    if(length>0){

        forward/=length;
        right/=length;


        const dx=
            Math.sin(yaw)*forward+
            Math.cos(yaw)*right;


        const dz=
            Math.cos(yaw)*forward-
            Math.sin(yaw)*right;


        const nx=
            player.position.x+
            dx*speed;


        const nz=
            player.position.z+
            dz*speed;


        if(!buildingCollision(nx,nz)){

            player.position.x=nx;
            player.position.z=nz;

        }


        player.rotation.y=
            yaw;


        animation(
            runAction || walkAction
        );

    }
    else{

        animation(idleAction);

    }
}


/* =========================
   BUILDING COLLISION
========================= */

function buildingCollision(x,z){

    const radius=.8;


    for(const b of buildings){

        const box=
            new THREE.Box3()
            .setFromObject(b);


        if(
            x>box.min.x-radius &&
            x<box.max.x+radius &&
            z>box.min.z-radius &&
            z<box.max.z+radius
        ){

            return true;

        }

    }


    return false;
}


/* =========================
   CAMERA
========================= */

function updateCamera(){

    const distance=7;

    const height=3.5;


    const x=
        player.position.x+
        Math.sin(yaw)*distance;


    const z=
        player.position.z+
        Math.cos(yaw)*distance;


    camera.position.set(
        x,
        player.position.y+
        height+
        pitch*2,
        z
    );


    const target=
        new THREE.Vector3(
            player.position.x,
            player.position.y+2.1,
            player.position.z
        );


    camera.lookAt(target);
}


/* =========================
   SHOOT
========================= */

function shoot(){

    if(!running || dead)
        return;


    const now=performance.now();


    if(now-lastShot<170)
        return;


    if(ammo<=0){

        reload();

        return;

    }


    lastShot=now;

    ammo--;

    updateAmmo();


    const bullet=
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .11,
                8,
                8
            ),

            new THREE.MeshBasicMaterial({
                color:0xffff00
            })

        );


    bullet.position.set(
        player.position.x,
        2.3,
        player.position.z
    );


    const direction=
        new THREE.Vector3();


    camera.getWorldDirection(
        direction
    );


    bullet.userData.velocity=
        direction.multiplyScalar(.8);


    bullet.userData.life=100;


    scene.add(bullet);

    bullets.push(bullet);
}


/* =========================
   BULLETS
========================= */

function updateBullets(){

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const b=bullets[i];


        b.position.add(
            b.userData.velocity
        );


        b.userData.life--;


        let hit=false;


        for(
            let j=enemies.length-1;
            j>=0;
            j--
        ){

            const e=enemies[j];


            const d=
                b.position.distanceTo(
                    e.mesh.position
                );


            if(d<2.2){

                e.hp-=50;

                scene.remove(b);

                bullets.splice(i,1);

                hit=true;


                if(e.hp<=0){

                    scene.remove(
                        e.mesh
                    );

                    enemies.splice(
                        j,
                        1
                    );

                    updateEnemyHUD();

                }


                break;

            }

        }


        if(
            !hit &&
            b.userData.life<=0
        ){

            scene.remove(b);

            bullets.splice(i,1);

        }

    }
}


/* =========================
   ENEMY AI
========================= */

function updateEnemies(){

    const now=performance.now();


    for(const e of enemies){

        const dx=
            player.position.x-
            e.mesh.position.x;


        const dz=
            player.position.z-
            e.mesh.position.z;


        const distance=
            Math.sqrt(
                dx*dx+dz*dz
            );


        if(distance>5){

            const s=.018;


            e.mesh.position.x+=
                dx/distance*s;


            e.mesh.position.z+=
                dz/distance*s;

        }


        e.mesh.lookAt(
            player.position.x,
            2,
            player.position.z
        );


        if(
            distance<45 &&
            now-e.cooldown>1500
        ){

            enemyShoot(e);

            e.cooldown=now;

        }


        e.mixer.update(
            clock.getDelta()
        );

    }
}


/* =========================
   ENEMY SHOOT
========================= */

function enemyShoot(e){

    const bullet=
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .12,
                8,
                8
            ),

            new THREE.MeshBasicMaterial({
                color:0xff3333
            })

        );


    bullet.position.copy(
        e.mesh.position
    );

    bullet.position.y=2.2;


    const dir=
        new THREE.Vector3(
            player.position.x-
            bullet.position.x,
            2-
            bullet.position.y,
            player.position.z-
            bullet.position.z
        ).normalize();


    bullet.userData.velocity=
        dir.multiplyScalar(.4);


    bullet.userData.life=150;


    scene.add(bullet);

    enemyBullets.push(bullet);
}


/* =========================
   ENEMY BULLETS
========================= */

function updateEnemyBullets(){

    for(
        let i=enemyBullets.length-1;
        i>=0;
        i--
    ){

        const b=enemyBullets[i];


        b.position.add(
            b.userData.velocity
        );


        b.userData.life--;


        const d=
            b.position.distanceTo(
                player.position
            );


        if(d<1.7){

            health-=10;

            updateHealth();


            scene.remove(b);

            enemyBullets.splice(i,1);


            if(health<=0){

                gameOver();

            }


            continue;

        }


        if(
            b.userData.life<=0
        ){

            scene.remove(b);

            enemyBullets.splice(i,1);

        }

    }
}


/* =========================
   RELOAD
========================= */

function reload(){

    if(ammo===30)
        return;

    if(reserve<=0)
        return;


    shooting=false;


    const need=
        30-ammo;


    const take=
        Math.min(
            need,
            reserve
        );


    setTimeout(()=>{

        ammo+=take;

        reserve-=take;

        updateAmmo();

    },800);
}


/* =========================
   HUD
========================= */

function updateHealth(){

    document.getElementById(
        "hp"
    ).style.width=
        Math.max(
            0,
            health
        )+"%";
}


function updateAmmo(){

    document.getElementById(
        "ammo"
    ).textContent=
        "🔫 "+
        ammo+
        " / "+
        reserve;
}


function updateEnemyHUD(){

    document.getElementById(
        "enemies"
    ).textContent=
        "👾 ENEMIES: "+
        enemies.length;
}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    if(dead)
        return;


    dead=true;

    running=false;

    shooting=false;


    document.getElementById(
        "over"
    ).style.display="flex";
}


/* =========================
   LOOP
========================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    const dt=
        clock.getDelta();


    if(running){

        updatePlayer();

        updateCamera();

        updateBullets();

        updateEnemies();

        updateEnemyBullets();


        if(shooting)
            shoot();


        if(mixer)
            mixer.update(dt);

    }


    renderer.render(
        scene,
        camera
    );
}


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


init();

</script>

</body>
</html>
