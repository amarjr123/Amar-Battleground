<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Amar Battleground v0.4</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#101510;
    font-family:Arial,sans-serif;
    touch-action:none;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
}

#hud{
    position:fixed;
    top:10px;
    left:12px;
    color:white;
    font-weight:bold;
    font-size:15px;
    text-shadow:2px 2px 3px #000;
    z-index:10;
}

#healthBox{
    position:fixed;
    top:36px;
    left:12px;
    width:210px;
    height:13px;
    border:2px solid #ffffffaa;
    border-radius:8px;
    background:#222;
    overflow:hidden;
    z-index:10;
}

#health{
    height:100%;
    width:100%;
    background:#42d65a;
}

#zone{
    position:fixed;
    top:55px;
    left:12px;
    color:white;
    font-size:12px;
    text-shadow:1px 1px 2px #000;
    z-index:10;
}

#help{
    position:fixed;
    bottom:8px;
    left:50%;
    transform:translateX(-50%);
    background:#000b;
    color:white;
    padding:6px 10px;
    border-radius:8px;
    font-size:12px;
    z-index:10;
}

#start{
    position:fixed;
    inset:0;
    display:grid;
    place-items:center;
    background:linear-gradient(#0009,#000d);
    z-index:30;
    color:white;
}

.panel{
    width:min(430px,90vw);
    padding:30px;
    border-radius:18px;
    text-align:center;
    background:#151d17;
    border:1px solid #ffffff22;
    box-shadow:0 20px 60px #000;
}

.panel h1{
    margin:0 0 8px;
    font-size:34px;
    letter-spacing:1px;
}

.panel p{
    opacity:.8;
    margin:8px 0 22px;
}

.panel button{
    font-size:18px;
    padding:13px 28px;
    border:0;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

#joy{
    position:fixed;
    left:22px;
    bottom:28px;
    width:132px;
    height:132px;
    border:3px solid #ffffff55;
    border-radius:50%;
    background:#ffffff12;
    z-index:20;
    display:none;
}

#knob{
    position:absolute;
    left:39px;
    top:39px;
    width:50px;
    height:50px;
    border-radius:50%;
    background:#ffffff66;
}

#fire{
    position:fixed;
    right:22px;
    bottom:36px;
    width:92px;
    height:92px;
    border-radius:50%;
    border:3px solid #fff8;
    background:#c93636cc;
    color:white;
    font-weight:800;
    font-size:17px;
    z-index:20;
    display:none;
}

#reload{
    position:fixed;
    right:130px;
    bottom:55px;
    border:1px solid #fff8;
    border-radius:11px;
    background:#111c;
    color:white;
    padding:12px;
    z-index:20;
    display:none;
}

@media(max-width:700px){

    #joy,
    #fire,
    #reload{
        display:block;
    }

    #help{
        display:none;
    }

}

</style>
</head>

<body>

<canvas id="game"></canvas>


<div id="hud">

HP:
<span id="hp">100</span>

|

Enemies:
<span id="enemies">10</span>

|

Ammo:
<span id="ammo">30</span>

|

Loot:
<span id="loot">0</span>

</div>


<div id="healthBox">
    <div id="health"></div>
</div>


<div id="zone">
    AMAR ISLAND • RIFLE
</div>


<div id="help">
    WASD = Move • Mouse = Aim • Click = Fire • R = Reload • E = Loot
</div>


<div id="joy">
    <div id="knob"></div>
</div>


<button id="fire">
    FIRE
</button>


<button id="reload">
    RELOAD
</button>


<div id="start">

    <div class="panel">

        <h1>
            AMAR BATTLEGROUND
        </h1>

        <p>
            V0.4 • Scrolling Battle Map
        </p>

        <button id="startBtn">
            START GAME
        </button>

    </div>

</div>


<script>

/* =========================
   CANVAS
========================= */

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");


let W = innerWidth;
let H = innerHeight;


canvas.width = W;
canvas.height = H;


/* =========================
   WORLD
========================= */

const WORLD_W = 2600;
const WORLD_H = 1800;


/* =========================
   PLAYER
========================= */

let player = {

    x:1300,
    y:900,

    r:18,

    hp:100,

    speed:3.4

};


/* =========================
   GAME DATA
========================= */

let enemies = [];

let bullets = [];

let enemyBullets = [];

let obstacles = [];

let trees = [];

let rocks = [];

let loot = [];

let roads = [];


let keys = {};

let running = false;

let gameOver = false;

let ammo = 30;

let lastShot = 0;

let lootCount = 0;


let camera = {

    x:0,
    y:0

};


let mouse = {

    x:W/2,
    y:H/2,

    down:false

};


let joystickX = 0;

let joystickY = 0;


/* =========================
   HUD
========================= */

const hpElement =
document.getElementById("hp");

const enemyElement =
document.getElementById("enemies");

const ammoElement =
document.getElementById("ammo");

const healthElement =
document.getElementById("health");

const lootElement =
document.getElementById("loot");


function updateHUD(){

    hpElement.textContent =
        Math.ceil(
            Math.max(
                0,
                player.hp
            )
        );

    enemyElement.textContent =
        enemies.length;

    ammoElement.textContent =
        ammo;

    lootElement.textContent =
        lootCount;

    healthElement.style.width =
        Math.max(
            0,
            player.hp
        ) + "%";

}


/* =========================
   RESIZE
========================= */

window.addEventListener(
"resize",
function(){

    W = innerWidth;
    H = innerHeight;

    canvas.width = W;
    canvas.height = H;

    updateCamera();

}
);


/* =========================
   KEYBOARD
========================= */

window.addEventListener(
"keydown",
function(e){

    keys[
        e.key.toLowerCase()
    ] = true;


    if(
        e.key.toLowerCase() === "r"
    ){

        ammo = 30;

    }


    if(
        e.key.toLowerCase() === "e"
    ){

        collectLoot();

    }


    if(
        e.key === "Enter" &&
        gameOver
    ){

        resetGame();

    }

});


window.addEventListener(
"keyup",
function(e){

    keys[
        e.key.toLowerCase()
    ] = false;

});


/* =========================
   MOUSE
========================= */

canvas.addEventListener(
"mousemove",
function(e){

    mouse.x = e.clientX;
    mouse.y = e.clientY;

});


canvas.addEventListener(
"mousedown",
function(){

    mouse.down = true;

});


window.addEventListener(
"mouseup",
function(){

    mouse.down = false;

});


/* =========================
   WORLD CREATION
========================= */

function createWorld(){

    obstacles = [];
    trees = [];
    rocks = [];
    loot = [];
    roads = [];


    /* ROADS */

    roads.push({

        x:0,
        y:820,

        w:WORLD_W,
        h:120

    });


    roads.push({

        x:1180,
        y:0,

        w:150,
        h:WORLD_H

    });


    /* BUILDINGS */

    const houses = [

        [260,220,260,180],

        [760,170,300,190],

        [1660,210,310,190],

        [2040,500,300,190],

        [330,1160,300,190],

        [850,1320,320,190],

        [1640,1170,340,190],

        [2060,1360,270,170]

    ];


    for(
        const h of houses
    ){

        obstacles.push({

            x:h[0],
            y:h[1],

            w:h[2],
            h:h[3],

            type:"house"

        });

    }


    /* TREES */

    for(
        let i=0;
        i<95;
        i++
    ){

        let x =
            80 +
            Math.random() *
            (WORLD_W-160);

        let y =
            80 +
            Math.random() *
            (WORLD_H-160);


        if(
            Math.hypot(
                x-1300,
                y-900
            ) < 230
        ){

            continue;

        }


        if(
            blockedPoint(
                x,
                y,
                25
            )
        ){

            continue;

        }


        trees.push({

            x:x,
            y:y,

            r:
                18 +
                Math.random()*10

        });

    }


    /* ROCKS */

    for(
        let i=0;
        i<35;
        i++
    ){

        let x =
            70 +
            Math.random() *
            (WORLD_W-140);

        let y =
            70 +
            Math.random() *
            (WORLD_H-140);


        if(
            blockedPoint(
                x,
                y,
                18
            )
        ){

            continue;

        }


        rocks.push({

            x:x,
            y:y,

            r:
                8 +
                Math.random()*8

        });

    }


    /* LOOT */

    for(
        let i=0;
        i<18;
        i++
    ){

        let x;
        let y;


        do{

            x =
                100 +
                Math.random() *
                (WORLD_W-200);

            y =
                100 +
                Math.random() *
                (WORLD_H-200);

        }
        while(

            Math.hypot(
                x-1300,
                y-900
            ) < 250

            ||

            blockedPoint(
                x,
                y,
                30
            )

        );


        loot.push({

            x:x,
            y:y,

            taken:false,

            type:
                i % 3

        });

    }

}


/* =========================
   BLOCK CHECK
========================= */

function blockedPoint(
    x,
    y,
    r
){

    return obstacles.some(
        function(b){

            return (

                x+r > b.x &&

                x-r <
                b.x+b.w &&

                y+r > b.y &&

                y-r <
                b.y+b.h

            );

        }
    );

}


/* =========================
   ENEMY SPAWN
========================= */

function spawnEnemies(){

    enemies = [];


    for(
        let i=0;
        i<10;
        i++
    ){

        let enemy;


        do{

            enemy = {

                x:
                    80 +
                    Math.random() *
                    (WORLD_W-160),

                y:
                    80 +
                    Math.random() *
                    (WORLD_H-160),

                r:18,

                hp:100,

                speed:
                    0.85 +
                    Math.random()*0.3,

                cooldown:
                    Math.random()*100

            };

        }
        while(

            Math.hypot(
                enemy.x-player.x,
                enemy.y-player.y
            ) < 380

            ||

            blockedPoint(
                enemy.x,
                enemy.y,
                20
            )

        );


        enemies.push(
            enemy
        );

    }

}


/* =========================
   RESET
========================= */

function resetGame(){

    player = {

        x:1300,
        y:900,

        r:18,

        hp:100,

        speed:3.4

    };


    bullets = [];

    enemyBullets = [];

    ammo = 30;

    lootCount = 0;

    gameOver = false;


    createWorld();

    spawnEnemies();

    updateCamera();

    updateHUD();

}


/* =========================
   CAMERA
========================= */

function updateCamera(){

    camera.x =
        Math.max(
            0,

            Math.min(
                WORLD_W-W,
                player.x-W/2
            )
        );


    camera.y =
        Math.max(
            0,

            Math.min(
                WORLD_H-H,
                player.y-H/2
            )
        );

}


/* =========================
   MOUSE WORLD POSITION
========================= */

function getWorldMouse(){

    return {

        x:
            mouse.x +
            camera.x,

        y:
            mouse.y +
            camera.y

    };

}


/* =========================
   CIRCLE / RECTANGLE
========================= */

function circleRect(
    x,
    y,
    r,
    b
){

    const nx =
        Math.max(
            b.x,
            Math.min(
                x,
                b.x+b.w
            )
        );


    const ny =
        Math.max(
            b.y,
            Math.min(
                y,
                b.y+b.h
            )
        );


    return Math.hypot(
        x-nx,
        y-ny
    ) < r;

}


/* =========================
   BLOCKED CIRCLE
========================= */

function blockedCircle(
    x,
    y,
    r
){

    return obstacles.some(
        function(b){

            return circleRect(
                x,
                y,
                r,
                b
            );

        }
    );

}


/* =========================
   MOVE ENTITY
========================= */

function moveEntity(
    object,
    dx,
    dy
){

    const newX =
        object.x+dx;

    const newY =
        object.y+dy;


    if(

        newX > object.r &&

        newX <
        WORLD_W-object.r &&

        !blockedCircle(
            newX,
            object.y,
            object.r
        )

    ){

        object.x =
            newX;

    }


    if(

        newY > object.r &&

        newY <
        WORLD_H-object.r &&

        !blockedCircle(
            object.x,
            newY,
            object.r
        )

    ){

        object.y =
            newY;

    }

}


/* =========================
   SHOOT
========================= */

function shoot(){

    if(
        !running ||
        gameOver ||
        ammo <= 0
    ){

        return;

    }


    const now =
        performance.now();


    if(
        now-lastShot < 135
    ){

        return;

    }


    lastShot = now;

    ammo--;


    const m =
        getWorldMouse();


    const angle =
        Math.atan2(

            m.y-player.y,

            m.x-player.x

        );


    bullets.push({

        x:
            player.x +
            Math.cos(angle)*28,

        y:
            player.y +
            Math.sin(angle)*28,

        vx:
            Math.cos(angle)*13,

        vy:
            Math.sin(angle)*13,

        life:80

    });

}


/* =========================
   COLLISION
========================= */

function hit(
    a,
    b
){

    return (

        Math.hypot(
            a.x-b.x,
            a.y-b.y
        )

        <

        a.r+b.r

    );

}


/* =========================
   LOOT
========================= */

function collectLoot(){

    for(
        const item of loot
    ){

        if(

            !item.taken &&

            Math.hypot(
                item.x-player.x,
                item.y-player.y
            ) < 55

        ){

            item.taken = true;

            lootCount++;


            ammo =
                Math.min(
                    60,
                    ammo+15
                );


            if(
                item.type === 1
            ){

                player.hp =
                    Math.min(
                        100,
                        player.hp+20
                    );

            }

        }

    }


    updateHUD();

}


/* =========================
   ENEMY SHOOT
========================= */

function enemyShoot(
    enemy
){

    const angle =
        Math.atan2(

            player.y-enemy.y,

            player.x-enemy.x

        );


    enemyBullets.push({

        x:enemy.x,

        y:enemy.y,

        vx:
            Math.cos(angle)*5,

        vy:
            Math.sin(angle)*5,

        r:4,

        life:150

    });

}


/* =========================
   UPDATE
========================= */

function update(){

    if(
        !running ||
        gameOver
    ){

        return;

    }


    /* PLAYER */

    let dx =

        (keys.d ? 1 : 0)

        -

        (keys.a ? 1 : 0)

        +

        joystickX;


    let dy =

        (keys.s ? 1 : 0)

        -

        (keys.w ? 1 : 0)

        +

        joystickY;


    let length =
        Math.hypot(
            dx,
            dy
        );


    if(
        length > 1
    ){

        dx /= length;

        dy /= length;

    }


    moveEntity(

        player,

        dx*player.speed,

        dy*player.speed

    );


    updateCamera();


    /* SHOOT */

    if(
        mouse.down
    ){

        shoot();

    }


    /* BULLETS */

    for(
        const bullet of bullets
    ){

        bullet.x +=
            bullet.vx;

        bullet.y +=
            bullet.vy;

        bullet.life--;

    }


    bullets =
        bullets.filter(
            function(b){

                return (

                    b.life > 0 &&

                    b.x > -20 &&

                    b.x <
                    WORLD_W+20 &&

                    b.y > -20 &&

                    b.y <
                    WORLD_H+20

                );

            }
        );


    /* ENEMIES */

    for(
        const enemy of enemies
    ){

        const angle =
            Math.atan2(

                player.y-enemy.y,

                player.x-enemy.x

            );


        const distance =
            Math.hypot(

                player.x-enemy.x,

                player.y-enemy.y

            );


        if(
            distance > 170
        ){

            moveEntity(

                enemy,

                Math.cos(angle) *
                enemy.speed,

                Math.sin(angle) *
                enemy.speed

            );

        }


        if(
            distance < 65
        ){

            player.hp -=
                0.055;

        }


        enemy.cooldown--;


        if(

            distance < 650 &&

            enemy.cooldown <= 0

        ){

            enemy.cooldown =
                90 +
                Math.random()*70;


            enemyShoot(
                enemy
            );

        }

    }


    /* PLAYER HITS */

    for(
        const bullet of bullets
    ){

        for(
            const enemy of enemies
        ){

            if(

                enemy.hp > 0 &&

                hit(
                    bullet,
                    enemy
                )

            ){

                enemy.hp -=
                    50;

                bullet.life = 0;

                break;

            }

        }

    }


    enemies =
        enemies.filter(
            function(enemy){

                return enemy.hp > 0;

            }
        );


    /* ENEMY BULLETS */

    for(
        const bullet of enemyBullets
    ){

        bullet.x +=
            bullet.vx;

        bullet.y +=
            bullet.vy;

        bullet.life--;


        if(
            hit(
                bullet,
                player
            )
        ){

            player.hp -=
                8;

            bullet.life = 0;

        }

    }


    enemyBullets =
        enemyBullets.filter(
            function(b){

                return (

                    b.life > 0 &&

                    b.x > -50 &&

                    b.x <
                    WORLD_W+50 &&

                    b.y > -50 &&

                    b.y <
                    WORLD_H+50

                );

            }
        );


    /* GAME END */

    if(
        player.hp <= 0
    ){

        player.hp = 0;

        gameOver = true;

    }


    if(
        enemies.length === 0
    ){

        gameOver = true;

    }


    updateHUD();

}


/* =========================
   DRAW HOUSE
========================= */

function drawHouse(
    building
){

    ctx.fillStyle =
        "#756c5b";


    ctx.fillRect(

        building.x,

        building.y,

        building.w,

        building.h

    );


    ctx.strokeStyle =
        "#29251f";

    ctx.lineWidth = 8;


    ctx.strokeRect(

        building.x,

        building.y,

        building.w,

        building.h

    );


    /* windows */

    ctx.fillStyle =
        "#6aa8c8";


    ctx.fillRect(

        building.x+28,

        building.y+35,

        45,

        32

    );


    ctx.fillRect(

        building.x+
        building.w-73,

        building.y+35,

        45,

        32

    );


    /* door */

    ctx.fillStyle =
        "#9b7546";


    ctx.fillRect(

        building.x+
        building.w/2-22,

        building.y+
        building.h-55,

        44,

        55

    );

}


/* =========================
   DRAW SOLDIER
========================= */

function drawSoldier(
    object,
    enemy
){

    let target;


    if(
        enemy
    ){

        target = {

            x:
                player.x-camera.x,

            y:
                player.y-camera.y

        };

    }
    else{

        target =
            getWorldMouse();

    }


    let angle =
        Math.atan2(

            target.y-
            (object.y-camera.y),

            target.x-
            (object.x-camera.x)

        );


    if(
        enemy
    ){

        angle =
            Math.atan2(

                player.y-object.y,

                player.x-object.x

            );

    }


    ctx.save();


    ctx.translate(
        object.x,
        object.y
    );


    ctx.rotate(
        angle
    );


    /* shadow */

    ctx.fillStyle =
        "#0005";


    ctx.beginPath();

    ctx.ellipse(

        0,
        17,

        19,
        8,

        0,
        0,
        Math.PI*2

    );

    ctx.fill();


    /* legs */

    ctx.strokeStyle =
        "#20252b";

    ctx.lineWidth = 7;


    ctx.beginPath();

    ctx.moveTo(
        -7,
        10
    );

    ctx.lineTo(
        -9,
        22
    );


    ctx.moveTo(
        7,
        10
    );

    ctx.lineTo(
        9,
        22
    );


    ctx.stroke();


    /* body */

    ctx.fillStyle =
        enemy ?
        "#9d3b3b" :
        "#2f78b7";


    ctx.beginPath();

    ctx.roundRect(

        -12,
        -10,

        24,
        28,

        7

    );

    ctx.fill();


    /* vest */

    ctx.fillStyle =
        enemy ?
        "#713030" :
        "#244e70";


    ctx.fillRect(

        -10,
        -5,

        20,
        14

    );


    /* head */

    ctx.fillStyle =
        "#d9a77c";


    ctx.beginPath();

    ctx.arc(

        0,
        -16,

        9,

        0,
        Math.PI*2

    );

    ctx.fill();


    /* helmet */

    ctx.fillStyle =
        enemy ?
        "#5b2727" :
        "#253a4c";


    ctx.beginPath();

    ctx.arc(

        0,
        -19,

        10,

        Math.PI,

        Math.PI*2

    );

    ctx.fill();


    /* gun */

    ctx.fillStyle =
        "#1b1d1f";


    ctx.fillRect(

        8,
        -3,

        32,
        7

    );


    ctx.fillRect(

        17,
        3,

        8,
        7

    );


    /* muzzle */

    if(
        !enemy &&
        mouse.down
    ){

        ctx.fillStyle =
            "#ffd34a";


        ctx.beginPath();


        ctx.moveTo(
            40,
            0
        );


        ctx.lineTo(
            51,
            -6
        );


        ctx.lineTo(
            47,
            0
        );


        ctx.lineTo(
            51,
            6
        );


        ctx.closePath();

        ctx.fill();

    }


    ctx.restore();


    /* enemy HP */

    if(
        enemy
    ){

        ctx.fillStyle =
            "#222";


        ctx.fillRect(

            object.x-22,

            object.y-34,

            44,

            6

        );


        ctx.fillStyle =
            "#49d263";


        ctx.fillRect(

            object.x-22,

            object.y-34,

            44 *
            Math.max(
                0,
                object.hp
            ) /
            100,

            6

        );

    }

}


/* =========================
   DRAW
========================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    ctx.save();


    ctx.translate(

        -camera.x,

        -camera.y

    );


    /* ground */

    ctx.fillStyle =
        "#315b35";


    ctx.fillRect(

        0,
        0,

        WORLD_W,
        WORLD_H

    );


    /* roads */

    ctx.fillStyle =
        "#56534b";


    for(
        const road of roads
    ){

        ctx.fillRect(

            road.x,
            road.y,

            road.w,
            road.h

        );

    }


    /* road markings */

    ctx.strokeStyle =
        "#d7c86a";

    ctx.lineWidth = 4;

    ctx.setLineDash([
        28,
        22
    ]);


    for(
        const road of roads
    ){

        ctx.beginPath();


        if(
            road.w >
            road.h
        ){

            ctx.moveTo(

                road.x,

                road.y+
                road.h/2

            );


            ctx.lineTo(

                road.x+
                road.w,

                road.y+
                road.h/2

            );

        }
        else{

            ctx.moveTo(

                road.x+
                road.w/2,

                road.y

            );


            ctx.lineTo(

                road.x+
                road.w/2,

                road.y+
                road.h

            );

        }


        ctx.stroke();

    }


    ctx.setLineDash([]);


    /* grid */

    ctx.strokeStyle =
        "#ffffff0a";

    ctx.lineWidth = 1;


    for(
        let x=0;
        x<WORLD_W;
        x+=80
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            WORLD_H
        );

        ctx.stroke();

    }


    for(
        let y=0;
        y<WORLD_H;
        y+=80
    ){

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            WORLD_W,
            y
        );

        ctx.stroke();

    }


    /* safe zone */

    ctx.strokeStyle =
        "#55cfff";

    ctx.lineWidth = 5;


    ctx.beginPath();

    ctx.arc(

        1300,
        900,

        520,

        0,
        Math.PI*2

    );


    ctx.stroke();


    /* trees */

    for(
        const tree of trees
    ){

        ctx.fillStyle =
            "#4a2e1c";


        ctx.fillRect(

            tree.x-4,

            tree.y+8,

            8,

            18

        );


        ctx.fillStyle =
            "#1d7a3a";


        ctx.beginPath();

        ctx.arc(

            tree.x,
            tree.y,

            tree.r,

            0,
            Math.PI*2

        );

        ctx.fill();


        ctx.fillStyle =
            "#2a9149";


        ctx.beginPath();

        ctx.arc(

            tree.x-7,

            tree.y-7,

            tree.r*.65,

            0,
            Math.PI*2

        );

        ctx.fill();

    }


    /* rocks */

    for(
        const rock of rocks
    ){

        ctx.fillStyle =
            "#777";


        ctx.beginPath();

        ctx.ellipse(

            rock.x,

            rock.y,

            rock.r,

            rock.r*.7,

            0,

            0,

            Math.PI*2

        );

        ctx.fill();

    }


    /* buildings */

    for(
        const building of obstacles
    ){

        drawHouse(
            building
        );

    }


    /* loot */

    for(
        const item of loot
    ){

        if(
            item.taken
        ){

            continue;

        }


        ctx.fillStyle =
            item.type === 1
            ?
            "#47c76b"
            :
            "#e3ae32";


        ctx.fillRect(

            item.x-14,

            item.y-11,

            28,

            22

        );


        ctx.fillStyle =
            "#fff4a6";


        ctx.fillRect(

            item.x-8,

            item.y-3,

            16,

            6

        );


        ctx.strokeStyle =
            "#3b2b16";


        ctx.strokeRect(

            item.x-14,

            item.y-11,

            28,

            22

        );

    }


    /* enemies */

    for(
        const enemy of enemies
    ){

        drawSoldier(
            enemy,
            true
        );

    }


    /* player bullets */

    for(
        const bullet of bullets
    ){

        ctx.fillStyle =
            "#ffd84a";


        ctx.beginPath();

        ctx.arc(

            bullet.x,

            bullet.y,

            4,

            0,

            Math.PI*2

        );

        ctx.fill();

    }


    /* enemy bullets */

    for(
        const bullet of enemyBullets
    ){

        ctx.fillStyle =
            "#ff674d";


        ctx.beginPath();

        ctx.arc(

            bullet.x,

            bullet.y,

            bullet.r,

            0,

            Math.PI*2

        );

        ctx.fill();

    }


    /* player */

    drawSoldier(
        player,
        false
    );


    ctx.restore();


    /* GAME OVER */

    if(
        gameOver
    ){

        ctx.fillStyle =
            "#000b";


        ctx.fillRect(

            0,
            0,
            W,
            H

        );


        ctx.fillStyle =
            "#fff";


        ctx.textAlign =
            "center";


        ctx.font =
            "bold 46px Arial";


        ctx.fillText(

            enemies.length === 0
            ?
            "VICTORY"
            :
            "YOU DIED",

            W/2,

            H/2-20

        );


        ctx.font =
            "20px Arial";


        ctx.fillText(

            "Press ENTER to restart",

            W/2,

            H/2+25

        );

    }

}


/* =========================
   GAME LOOP
========================= */

function gameLoop(){

    update();

    draw();

    requestAnimationFrame(
        gameLoop
    );

}


gameLoop();

/* =========================
   JOYSTICK
========================= */

const joystick =
document.getElementById(
    "joy"
);

const knob =
document.getElementById(
    "knob"
);

let joystickPointer = null;


joystick.addEventListener(
"pointerdown",
function(e){

    joystickPointer =
        e.pointerId;

    joystick.setPointerCapture(
        e.pointerId
    );

    moveJoystick(e);

});


joystick.addEventListener(
"pointermove",
function(e){

    if(
        e.pointerId ===
        joystickPointer
    ){

        moveJoystick(e);

    }

});


joystick.addEventListener(
"pointerup",
function(){

    joystickPointer =
        null;

    joystickX = 0;

    joystickY = 0;

    knob.style.left =
        "39px";

    knob.style.top =
        "39px";

});


function moveJoystick(e){

    const rect =
        joystick.getBoundingClientRect();


    let x =
        e.clientX -
        (
            rect.left+
            rect.width/2
        );


    let y =
        e.clientY -
        (
            rect.top+
            rect.height/2
        );


    const max = 40;


    const distance =
        Math.hypot(
            x,
            y
        );


    if(
        distance > max
    ){

        x =
            x/distance*max;

        y =
            y/distance*max;

    }


    joystickX =
        x/max;

    joystickY =
        y/max;


    knob.style.left =
        (39+x)+"px";

    knob.style.top =
        (39+y)+"px";

}


/* =========================
   MOBILE AIM
========================= */

window.addEventListener(
"pointermove",
function(e){

    if(

        e.pointerType ===
        "touch"

        &&

        e.clientX >
        W/2

    ){

        mouse.x =
            e.clientX;

        mouse.y =
            e.clientY;

    }

});

</script>
